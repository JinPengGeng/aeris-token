# Minimal Prometheus scrape configuration for the Aether gateway.
#
# This is a SAMPLE. Copy it into your Prometheus config directory (for example
# alongside docker-compose.yml as `prometheus/prometheus.yml`) and mount it at
# `/etc/prometheus/prometheus.yml` in the Prometheus container.
#
# The gateway serves self-rendered Prometheus text at `/_gateway/metrics` on
# APP_PORT (default 8084). All metric names carry the `aether_gateway_`
# namespace (configurable via `observability.metrics_namespace`).
#
# The matching alert rules live in `aether-alerts.yml` (same directory) and the
# Grafana dashboard in `grafana-dashboard.json`. Alert rule tests live in
# `aether-alerts.test.yml` and run through the repository's promtool fixture
# harness (see `docs/operations/metrics-acceptance-harness.md`).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aether-gateway
    metrics_path: /_gateway/metrics
    static_configs:
      # Single-node docker-compose: the `app` service is reachable by name.
      - targets: ["app:8084"]
        labels:
          service: aether-gateway
    # For a host-mounted deployment instead of compose, use:
    #   - targets: ["127.0.0.1:8084"]

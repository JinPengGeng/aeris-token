groups:
  - name: aether-billing-foundation
    rules:
      - alert: AetherBillingEnrichmentFailures
        expr: sum by (component, operation) (increase(aether_gateway_billing_enrichment_failures_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Billing enrichment failures are present
          description: Terminal usage events could not be enriched in the last 10 minutes.
          runbook: docs/operations/observability-runbook.md#billing-enrichment-or-settlement
          deduplication: Group by alertname, component and operation; inhibit info alerts while this warning is firing.
          rollback: Roll back the release only after checking the failed event path and DLQ; counters are additive and safe to revert.

      - alert: AetherBillingSettlementFailures
        expr: sum by (component, operation) (increase(aether_gateway_billing_settlement_failures_total[10m]) or increase(aether_gateway_billing_video_task_settlement_failures_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Terminal billing settlement failures are present
          description: Usage or video-task settlement failed in the last 10 minutes; verify persisted usage before retrying.
          runbook: docs/operations/observability-runbook.md#billing-enrichment-or-settlement
          deduplication: Group by alertname, component and operation; inhibit repeats for the same failed settlement path.
          rollback: Preserve usage and DLQ records; restore the dependency or roll back a release-correlated regression before idempotent replay.

      - alert: AetherBillingInsufficientQuota
        expr: sum by (component, operation) (increase(aether_gateway_billing_insufficient_quota_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Completed usage was finalized with insufficient quota
          description: A completed usage settlement was persisted without a wallet debit in the last 10 minutes; inspect the approved account policy and records before any manual action.
          runbook: docs/operations/observability-runbook.md#insufficient-quota
          deduplication: Group by alertname, component and operation; treat this as a visibility signal, not authorization to retry or charge.
          rollback: Counters are additive and safe to remove; do not change wallet or settlement state while rolling back telemetry.

      - alert: AetherUsageDeadLetterBacklog
        expr: max(aether_gateway_usage_queue_dlq_length) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Usage dead-letter queue is non-empty
          description: Usage events require operator review or an idempotent redrive.
          runbook: docs/operations/observability-runbook.md#usage-dlq
          deduplication: Group by alertname and stream; inhibit backlog alerts while the gateway is down.
          rollback: Do not delete the DLQ; pause redrive and restore the last known-good consumer if processing is suspect.

      - alert: AetherUsageDeadLetterCapacityWarning
        expr: aether_gateway_usage_queue_dlq_utilization_per_mille >= 800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Usage dead-letter retention is approaching its threshold
          description: DLQ entries occupy at least 80 percent of the configured retention threshold; preserve evidence and investigate consumers before trimming occurs.
          runbook: docs/operations/observability-runbook.md#usage-dlq
          deduplication: Group by alertname, job, instance and stream; inhibit this warning while the retention boundary alert is firing.
          rollback: Restore consumers or pause incoming traffic under the incident procedure; do not clear the DLQ to silence the alert.

      - alert: AetherUsageDeadLetterRetentionBoundary
        expr: aether_gateway_usage_queue_dlq_at_retention_boundary == 1
        labels:
          severity: critical
        annotations:
          summary: Usage dead-letter retention has reached its trimming threshold
          description: Redis approximate MAXLEN may trim older events at this threshold; this gauge is capacity risk, not proof or a count of lost events.
          runbook: docs/operations/observability-runbook.md#usage-dlq
          deduplication: Group by alertname, job, instance and stream; retain cluster labels and inhibit the capacity warning for the same series.
          rollback: Preserve available evidence and reduce inflow; increasing retention requires a Redis memory budget and is not a substitute for fixing consumers.

      - alert: AetherUsageTerminalDeferredDrop
        expr: increase(aether_gateway_usage_runtime_terminal_enqueue_deferred_dropped_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Terminal usage events were dropped after deferred persistence exhausted its fallback capacity
          description: Any terminal usage deferred-drop increment violates the zero-loss budget and requires an immediate accounting reconciliation incident.
          runbook: docs/operations/observability-runbook.md#usage-deferred-drop
          deduplication: Group by alertname, job and instance; retain cluster and deployment labels so the affected gateway remains identifiable.
          rollback: Restore Redis/runtime availability first and preserve receipt, request-id and log evidence; do not fabricate a usage record, settlement, or bill.

      - alert: AetherUsageLifecycleDeferredDrop
        expr: increase(aether_gateway_usage_runtime_lifecycle_enqueue_deferred_dropped_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Lifecycle usage events were dropped instead of retrying
          description: Any lifecycle deferred-drop increment violates the zero-loss budget and requires an immediate accounting reconciliation incident.
          runbook: docs/operations/observability-runbook.md#usage-deferred-drop
          deduplication: Group by alertname, job and instance; retain cluster and deployment labels so the affected gateway remains identifiable.
          rollback: Restore Redis/runtime availability first and preserve receipt, request-id and log evidence; do not fabricate a usage record, settlement, or bill.

      - alert: AetherBillingGuardFailOpen
        expr: sum by (component, operation) (increase(aether_gateway_billing_fail_open_total[10m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Billing or RPM guard allowed traffic during a runtime outage
          description: Inspect the operation label and restore the shared runtime before disabling the guard.
          runbook: docs/operations/observability-runbook.md#fail-open
          deduplication: Group by alertname, component and operation; inhibit repeats for the same outage window.
          rollback: Prefer restoring Redis/runtime connectivity; changing fail-open policy requires an explicit configuration review.

      - alert: AetherProviderServerErrors
        expr: sum by (provider) (rate(aether_gateway_request_errors_total{status_class="5xx"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Provider 5xx responses are elevated
          description: Terminal gateway requests have 5xx errors, grouped by the bounded provider type; inspect the failure origin before attributing an outage upstream.
          runbook: docs/operations/observability-runbook.md#provider-5xx
          deduplication: Group by alertname and provider; inhibit while a provider maintenance silence is active.
          rollback: Roll back only a release-correlated regression; otherwise fail over or contact the provider.

  - name: aether-admin-audit
    rules:
      - alert: AetherAdminAuditPersistenceFailures
        # Administrator mutations can be rare. A ratio, minimum request count
        # or pending window must not hide an isolated failed audit write.
        # Keep scrape labels so one unhealthy replica cannot hide in a sum.
        expr: increase(aether_gateway_admin_audit_persist_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Administrator audit persistence failed
          description: An administrator audit write failed or timed out in the last 10 minutes; the business operation may already be committed.
          runbook: docs/operations/admin-audit-persistence.md#incident-response
          deduplication: Group by alertname, component, job and instance; retain deployment or cluster labels and use Alertmanager repeat suppression.
          rollback: Restore the audit database or writer first; preserve event IDs and verify committed state before any replay or release rollback.

[package]
name = "tunnel-release-verifier"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the production verifier without pulling in the gateway test graph.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Opt-in production Redis durability profile.
# Apply with docker-compose.yml or docker-compose.single-node.yml; do not use
# this overlay for the lightweight local profile unless persistence is desired.
services:
  redis:
    command:
      - redis-server
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
      - --save
      - "60"
      - "1000"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxclients
      - ${REDIS_MAXCLIENTS:-10000}
    volumes:
      - redis_data:/data
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - test -w /data && redis-cli -a "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data:

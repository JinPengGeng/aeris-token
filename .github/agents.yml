# Declarative agent registry. Runtime code must load this file from the trusted
# default-branch SHA, never from an issue branch or pull-request checkout.
version: 1

trusted_source:
  ref: refs/heads/main
  path: .github/agents.yml

runtime:
  enabled_variable: AERIS_AGENTS_ENABLED
  default_enabled: false
  execution:
    mode: github_actions
    preflight_job: preflight
    best_effort_reservation_job: reserve
    analysis_job: analyze
    deterministic_writeback_job: publish
    result_artifact:
      format: json
      maximum_bytes: 1048576
      secrets_allowed: false
      raw_model_input_copied: false
      authoritative_state: false
      usable_as_lock: false
  api:
    base_url_variable: AERIS_AI_BASE_URL
    api_key_secret: AERIS_AI_API_KEY
    endpoint: /chat/completions
    default_model_variable: AERIS_AI_MODEL
    fallback_model_variable: AERIS_AI_MODEL_FALLBACK
    connect_timeout_seconds: 120
    request_timeout_seconds: 120
    maximum_response_bytes: 1048576
  limits:
    maximum_input_characters: 24000
    maximum_handoffs: 4
    maximum_fix_cycles: 2
    maximum_concurrent_runs_per_object: 1
    maximum_output_tokens: 4000
  reviewer_limits:
    # Reviewer input may include every changed-file record. This deliberately
    # does not widen the shared Issue/Triage input limit above.
    maximum_input_characters: 262144
    maximum_patch_characters_per_file: 65536
    # Large, complete PR patches can require longer inference than issue
    # analysis. The engine separately caps the whole fallback sequence to the
    # remaining reservation lease with publication headroom.
    request_timeout_seconds: 300

model_policy:
  # Values are GitHub Actions variable names. Their resolved model IDs form the
  # allowlist; an issue or comment cannot supply an arbitrary model ID.
  allowed_model_variables:
    - AERIS_AI_MODEL
    - AERIS_AI_MODEL_TRIAGE
    - AERIS_AI_MODEL_PLANNER
    - AERIS_AI_MODEL_REVIEWER
    - AERIS_AI_MODEL_WRITER
    - AERIS_AI_MODEL_SECURITY
    - AERIS_AI_MODEL_FALLBACK
  retryable_http_statuses: [408, 429, 500, 502, 503, 504]
  retryable_failures: [connect_error, timeout]
  non_retryable_http_statuses: [400, 401, 403, 404, 405, 409, 413, 422]
  structured_output:
    canary_agents: [planner]
    approved_model_ids: [gpt-5.6-sol]

agents:
  triage:
    enabled: true
    phase: "2.1"
    mode: read_only
    model_variable: AERIS_AI_MODEL_TRIAGE
    fallback_model_variable: AERIS_AI_MODEL_FALLBACK
    triggers: [issue_opened, issue_reopened, command_triage]
    tools: []
    effects: [propose_labels, update_managed_comment]
    handoff_to: [planner]

  planner:
    enabled: true
    phase: "2.1"
    mode: read_only
    model_variable: AERIS_AI_MODEL_PLANNER
    fallback_model_variable: AERIS_AI_MODEL_FALLBACK
    triggers: [command_plan, triage_handoff]
    tools: []
    effects: [update_managed_comment]
    handoff_to: [reviewer]

  reviewer:
    enabled: true
    phase: "2.1"
    mode: read_only
    model_variable: AERIS_AI_MODEL_REVIEWER
    fallback_model_variable: AERIS_AI_MODEL_FALLBACK
    triggers: [pull_request_opened, pull_request_synchronize, command_review]
    tools: [repository_read]
    effects: [update_managed_comment]
    handoff_to: [security]

  writer:
    enabled: false
    enabled_variable: AERIS_WRITER_ENABLED
    phase: 3
    mode: draft_pull_request
    identity: github_app
    app_id_variable: AERIS_WRITER_APP_ID
    private_key_secret: AERIS_WRITER_PRIVATE_KEY
    environment: writer
    credentials:
      allowed_jobs: [publish]
      github_token_write: false
    permissions:
      metadata: read
      contents: write
      pull_requests: write
      denied: [checks, actions, workflows, administration, deployments, environments, secrets, members, packages, issues]
    capability_residuals:
      pull_requests_write_can_review_or_merge: true
      contents_write_not_branch_scoped: true
      app_has_branch_protection_bypass: false
    deterministic_client_mitigations:
      allowed_operations: [create_or_update_agent_ref, create_or_update_draft_pull_request]
      denied_operations: [review, approve, merge, enable_auto_merge, mark_ready, close_pr, delete_branch]
    limits:
      maximum_files: 50
      maximum_patch_bytes: 65536
      maximum_file_size_bytes: 524288
      maximum_total_file_bytes: 2097152
      maximum_fix_cycles: 2
    model_variable: AERIS_AI_MODEL_WRITER
    fallback_model_variable: AERIS_AI_MODEL_FALLBACK
    triggers: [maintainer_command_implement, maintainer_command_retry_write]
    required_issue_labels: [agent-ready]
    required_actor_permissions: [admin, maintain, write]
    required_commands: [implement, retry-write]
    allowed_branch_prefixes: [agent/]
    tools: [repository_read, isolated_shell, branch_write, draft_pull_request]
    effects: [create_or_update_draft_pull_request]
    denied_paths:
      - .github/**
      - "**/CODEOWNERS"
      - .gitmodules
      - "**/.git"
      - "**/.git/**"
    handoff_to: [reviewer, tester, security]

  tester:
    enabled: false
    phase: 3
    mode: deterministic
    model_variable: null
    triggers: [writer_handoff, command_test]
    tools: [repository_read, ci_dispatch, ci_read]
    effects: [publish_advisory_check]
    handoff_to: [reviewer]

  security:
    enabled: false
    phase: 3
    mode: read_only
    model_variable: AERIS_AI_MODEL_SECURITY
    fallback_model_variable: AERIS_AI_MODEL_FALLBACK
    triggers: [sensitive_path_changed, reviewer_handoff]
    tools: [repository_read, dependency_metadata_read]
    effects: [publish_advisory_check]
    handoff_to: [policy]

  policy:
    enabled: false
    phase: 4
    mode: deterministic
    model_variable: null
    triggers: [pull_request_changed, required_checks_completed]
    tools: [repository_read, pull_request_metadata_read, checks_read]
    effects: [publish_policy_check]
    handoff_to: [merger]

  merger:
    enabled: false
    phase: 5
    mode: deterministic
    model_variable: null
    triggers: [policy_passed]
    tools: [pull_request_metadata_read, checks_read, exact_sha_merge]
    effects: [enable_auto_merge, merge_exact_sha]
    handoff_to: []

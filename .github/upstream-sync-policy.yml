# Path ownership contract for checkpoint-based upstream sync. Rules use the
# deliberately small aeris-glob-v1 matcher implemented by the sync runtime.
version: 1

upstream:
  repository: fawney19/Aether
  branch: main

sync:
  base_branch: main
  branch: automation/sync-upstream
  state_file: .github/upstream-sync-state.json
  pull_request_limit: 1
  fail_closed: true
  autonomous_merge: eligible

matching:
  syntax: aeris-glob-v1
  enforced_fork_owned_subset: exact_or_directory_recursive
  precedence:
    - sensitive
    - review_required
    - fork_owned
    - generated
    - upstream_owned
  default: review_required

fork_owned:
  - .github/agents.yml
  - .github/automation-policy.yml
  - .github/automation/**
  - .github/upstream-sync-policy.yml
  - .github/upstream-sync-state.json
  - .github/CODEOWNERS
  - .github/ISSUE_TEMPLATE/**
  - .github/dependabot.yml
  - .github/labeler.yml
  - .github/pull_request_template.md
  - .github/workflows/**
  - docs/automation-architecture.md
  - docs/development-workflow.md

review_required:
  - .github/**
  - Cargo.toml
  - Cargo.lock
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - frontend/package.json
  - frontend/package-lock.json
  - Dockerfile*
  - docker-compose*.yml
  - deploy.sh
  - "**/auth/**"
  - "**/migrations/**"
  - "**/security/**"

# These paths are not safe to advance past, even through a manual sync PR.
sensitive:
  - .gitmodules
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"

generated: []

upstream_owned:
  - apps/**
  - crates/**
  - frontend/**
  - docs/**
  - README*.md
  - LICENSE*

checkpoint:
  require_repository_match: true
  require_branch_match: true
  require_previous_sha_ancestor: true
  reject_history_rewrite: true
  advance_only_in_merged_pull_request: true

conflicts:
  preserve_existing_pull_request: true
  preserve_existing_branch: true
  overwrite_unknown_tip: false
  create_or_update_alert: true
  require_explicit_resolution_adoption: true
  ai_resolution:
    enabled: true
    profile: aeris-sync-conflict-v2
    required_pre_conflict_verdict: eligible
    allowed_type: modify_modify_utf8_text
    allowed_mode: "100644"
    maximum_files: 4
    maximum_bytes_per_file: 16384
    maximum_total_input_bytes: 65536
    resolver_model_variable: AERIS_AI_MODEL_CONFLICT_RESOLVER
    reviewer_model_variable: AERIS_AI_MODEL_CONFLICT_REVIEWER
    require_distinct_model_ids: true
    require_complete_resolution: true
    require_independent_review_pass: true
    allow_non_conflict_edits: false
    allow_sensitive_or_review_required_paths: false
    allow_binary_rename_delete_mode_or_case_ambiguity: false

workflow_drift:
  action: create_or_update_issue
  title_prefix: "Upstream workflow review required"
  deduplicate_by: upstream_workflow_tree

# Path ownership and resource-bound contract for upstream sync. The minimal
# sync loop (sync-upstream-minimal.yml) enforces the resource_bounds ceilings
# via bounded-git-fetch.sh; the ownership rules below remain the reviewed
# contract for classifying upstream changes.
version: 1

upstream:
  repository: fawney19/Aether
  branch: main

sync:
  base_branch: main
  branch: automation/sync-upstream
  pull_request_limit: 1
  fail_closed: true
  autonomous_merge: eligible

# These are compiled ceilings in bounded-git-fetch.sh. They are intentionally
# generous relative to the current ~52 MiB / 70k-object repository, while still
# bounding a single synchronization run and its deterministic source delta.
resource_bounds:
  fetch_timeout_seconds: 90
  max_received_bytes: 268435456
  max_received_expanded_bytes: 1073741824
  max_received_objects: 250000
  max_import_bytes: 268435456
  max_import_objects: 250000
  max_process_memory_bytes: 536870912
  max_object_bytes: 33554432
  max_blob_bytes: 33554432
  max_changed_blob_bytes: 268435456
  max_changed_paths: 20000
  max_tree_entries: 500000
  max_diff_bytes: 33554432

matching:
  syntax: aeris-glob-v1
  enforced_fork_owned_subset: exact_or_directory_recursive
  precedence:
    - sensitive
    - review_required
    - fork_owned
    - generated
    - upstream_owned
  default: review_required

fork_owned:
  - .github/agents.yml
  - .github/automation-policy.yml
  - .github/automation/**
  - .github/upstream-sync-policy.yml
  - .github/CODEOWNERS
  - .github/ISSUE_TEMPLATE/**
  - .github/dependabot.yml
  - .github/labeler.yml
  - .github/pull_request_template.md
  - .github/workflows/**
  - docs/automation-architecture.md
  - docs/development-workflow.md

review_required:
  - .github/**
  - Dockerfile*
  - docker-compose*.yml
  - deploy.sh
  - "**/auth/**"
  - "**/migrations/**"
  - "**/security/**"

# These paths are not safe to advance past, even through a manual sync PR.
sensitive:
  - .gitmodules
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"

generated: []

upstream_owned:
  - apps/**
  - crates/**
  - frontend/**
  - docs/**
  - README*.md
  - LICENSE*
  # Mechanical dependency manifests: validated by CI builds, not human review.
  - Cargo.toml
  - Cargo.lock
  - "**/Cargo.toml"
  - "**/Cargo.lock"

checkpoint:
  require_repository_match: true
  require_branch_match: true
  require_previous_sha_ancestor: true
  reject_history_rewrite: true
  advance_only_in_merged_pull_request: true

conflicts:
  preserve_existing_pull_request: true
  preserve_existing_branch: true
  overwrite_unknown_tip: false
  create_or_update_alert: true
  require_explicit_resolution_adoption: true
  ai_resolution:
    enabled: true
    profile: aeris-sync-conflict-v2
    required_pre_conflict_verdict: eligible
    allowed_type: modify_modify_utf8_text
    allowed_mode: "100644"
    maximum_files: 16
    maximum_bytes_per_file: 16384
    maximum_total_input_bytes: 65536
    resolver_model_variable: AERIS_AI_MODEL_CONFLICT_RESOLVER
    reviewer_model_variable: AERIS_AI_MODEL_CONFLICT_REVIEWER
    require_distinct_model_ids: true
    require_complete_resolution: true
    require_independent_review_pass: true
    allow_non_conflict_edits: false
    allow_sensitive_or_review_required_paths: false
    allow_binary_rename_delete_mode_or_case_ambiguity: false

workflow_drift:
  action: create_or_update_issue
  title_prefix: "Upstream workflow review required"
  deduplicate_by: upstream_workflow_tree

# Security and authorization policy for repository automation. Match and
# authorization decisions must use the copy from the current protected main SHA.
version: 1

trusted_source:
  ref: refs/heads/main
  immutable_paths:
    - .github/agents.yml
    - .github/automation-policy.yml
    - .github/automation/**
    - .github/upstream-sync-policy.yml
    - .github/upstream-sync-state.json
    - .github/CODEOWNERS
    - .github/workflows/**

kill_switch:
  repository_variable: AERIS_AGENTS_ENABLED
  enabled_values: ["1", "true"]
  default_enabled: false

commands:
  prefix: /agent
  supported: [triage, plan, review, status, cancel, implement, retry-write, merge]
  maintainer_only: [implement, retry-write, merge]
  accepted_author_associations: [OWNER, MEMBER, COLLABORATOR]
  ignore_actors:
    - github-actions[bot]
  ignore_markers:
    - "<!-- aeris-agent-managed -->"

authorization:
  public_read_only_commands: [status]
  trusted_read_only_commands: [triage, plan, review, status, cancel]
  automatic_issue_analysis_author_associations: [OWNER, MEMBER, COLLABORATOR]
  external_issue_analysis_requires_label: agent-analyze
  external_pull_request_analysis_requires_label: agent-analyze
  code_write_requires:
    actor_permission: [admin, maintain, write]
    exact_commands: [/agent implement, /agent retry-write]
    issue_labels: [agent-ready]
  merge_requires:
    author_association: [OWNER, MEMBER]

limits:
  maximum_issue_body_characters: 24000
  maximum_comment_characters: 8000
  maximum_runs_per_object_per_hour: 4
  maximum_concurrent_runs_per_object: 1
  maximum_handoffs: 4
  maximum_fix_cycles: 2

state:
  delivery_semantics: at_least_once
  canonical_object_generation: input_sha
  input_fingerprint:
    algorithm: sha256
    source: bounded_canonical_model_input
  github_generation_fast_check:
    authoritative: false
    fields:
      issue: updated_at
      pull_request: head_sha
  reject_stale_results: true
  managed_comment_marker: "<!-- aeris-agent-managed -->"
  update_single_managed_comment: true
  managed_comment_semantics: best_effort_projection
  managed_comment_is_compare_and_swap: false
  managed_comment_is_lock_or_lease: false
  managed_comment_is_audit_log: false
  strict_exactly_once: false
  exact_rate_limiting: false

prompt_security:
  issue_and_comment_text_is_untrusted: true
  require_structured_output: true
  allow_model_supplied_tool_arguments: false
  reveal_secrets_to_models: false
  triage_shell_access: false
  triage_network_access: false

writer:
  enabled: false
  enabled_variable: AERIS_WRITER_ENABLED
  branch_prefix: agent/
  draft_pull_requests_only: true
  maximum_open_pull_requests_per_issue: 1
  identity: github_app
  app_id_variable: AERIS_WRITER_APP_ID
  private_key_secret: AERIS_WRITER_PRIVATE_KEY
  environment: writer
  credentials:
    allowed_jobs: [publish]
    github_token_write: false
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    denied: [checks, actions, workflows, administration, deployments, environments, secrets, members, packages, issues]
  capability_residuals:
    pull_requests_write_can_review_or_merge: true
    contents_write_not_branch_scoped: true
    app_has_branch_protection_bypass: false
  deterministic_client_mitigations:
    allowed_operations: [create_or_update_agent_ref, create_or_update_draft_pull_request]
    denied_operations: [review, approve, merge, enable_auto_merge, mark_ready, close_pr, delete_branch]
  limits:
    maximum_files: 50
    maximum_patch_bytes: 65536
    maximum_file_size_bytes: 524288
    maximum_total_file_bytes: 2097152
    maximum_fix_cycles: 2
  forbidden_paths:
    - .github/**
    - "**/CODEOWNERS"
    - .gitmodules
    - "**/.git"
    - "**/.git/**"
  release_secret_access: false
  pull_request_target_checkout: false

policy_gate:
  enabled: false
  check_name: Automation Policy / gate
  mode: shadow
  allowed_modes: [shadow, human, label, allowlist]
  human_enable_label: automerge-approved
  require_exact_head_sha: true
  require_base_up_to_date: true
  require_conversation_resolution: true
  required_checks:
    - Rust CI / check
    - Frontend CI / check
  always_require_human_review:
    - .github/**
    - CODEOWNERS
    - Cargo.toml
    - Cargo.lock
    - "**/Cargo.toml"
    - "**/Cargo.lock"
    - frontend/package.json
    - frontend/package-lock.json
    - Dockerfile*
    - docker-compose*.yml
    - deploy.sh
    - "**/auth/**"
    - "**/migrations/**"
    - "**/security/**"
  allowlist_paths: []

audit:
  durable: false
  phase_2_sink: workflow_log
  record_fields:
    - source_key
    - object_id
    - input_sha
    - object_generation
    - policy_sha
    - agent
    - model_alias
    - model_id
    - result
    - reason_codes
    - next_agent
  redact_fields:
    - authorization
    - api_key
    - cookies
    - request_headers

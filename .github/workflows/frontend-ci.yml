name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "frontend/**"
      - ".github/agents.yml"
      - ".github/automation-policy.yml"
      - ".github/automation/**"
      - ".github/upstream-sync-policy.yml"
      - ".github/workflows/scripts/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      automation: ${{ steps.filter.outputs.automation || 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Local git mode keeps the contents: read-only boundary intact; the
          # API mode would require pull-requests: read on this job.
          token: ''
          base: ${{ github.base_ref }}
          # Filter groups live in the shared file so the trusted automation
          # runtime classifies pull request paths against the same definitions.
          filters: .github/change-filters.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check

  automation:
    name: Automation Contracts
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.automation == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/automation
      - run: npm test
        working-directory: .github/automation
      - run: node ../workflows/scripts/tests/test-automation-contracts.cjs
        working-directory: .github/automation
      - run: bash ../workflows/scripts/tests/test-sync-minimal-alerts.sh
        working-directory: .github/automation
      - run: bash ../workflows/scripts/tests/test-bounded-git-fetch.sh
        working-directory: .github/automation

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json
      - run: npm ci
      - name: Install aether-vscodex web dependencies
        if: ${{ hashFiles('aether-vscodex/web/package-lock.json') != '' }}
        working-directory: aether-vscodex/web
        run: npm ci
      - run: npm run build

  check:
    name: Frontend CI / check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - lint
      - type_check
      - test
      - build
      - automation
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        working-directory: .
        # Skipped jobs satisfy the gate: their changes filter did not match.
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.lint.result }}" = "cancelled" ] || \
             [ "${{ needs.type_check.result }}" = "failure" ] || [ "${{ needs.type_check.result }}" = "cancelled" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test.result }}" = "cancelled" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ] || \
             [ "${{ needs.automation.result }}" = "failure" ] || [ "${{ needs.automation.result }}" = "cancelled" ]; then
            echo "Frontend CI failed"
            exit 1
          fi

  publish_dispatch_status:
    name: Publish dispatch status
    runs-on: ubuntu-latest
    needs: check
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish Frontend CI status
        # This job has no checkout, so it must not inherit the workflow-wide
        # defaults.run.working-directory (frontend/ does not exist there).
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          result=success
          if [ "${CHECK_RESULT}" != "success" ]; then
            result=failure
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${result}" \
            -f context="Frontend CI / check" \
            -f description="Frontend CI ${result}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

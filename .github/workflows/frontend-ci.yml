name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "frontend/**"
      - ".github/agents.yml"
      - ".github/automation-policy.yml"
      - ".github/automation/**"
      - ".github/upstream-sync-policy.yml"
      - ".github/upstream-sync-state.json"
      - ".github/workflows/scripts/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check

  automation:
    name: Automation Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/automation
      - run: npm test
        working-directory: .github/automation
      - run: node ../workflows/scripts/tests/test-automation-contracts.cjs
        working-directory: .github/automation
      - run: bash ../workflows/scripts/tests/test-github-autonomy.sh
        working-directory: .github/automation
      - run: bash ../workflows/scripts/tests/test-sync-upstream-identity.sh
        working-directory: .github/automation

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  check:
    name: Frontend CI / check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    needs:
      - lint
      - type_check
      - test
      - build
      - automation
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=success
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type_check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.automation.result }}" != "success" ]; then
            result=failure
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="${result}" \
              -f context="Frontend CI / check" \
              -f description="Frontend CI ${result}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          if [ "${result}" != "success" ]; then
            echo "Frontend CI failed"
            exit 1
          fi

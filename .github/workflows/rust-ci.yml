name: Rust CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      data: ${{ steps.filter.outputs.data || 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Local git mode keeps the contents: read-only boundary intact; the
          # API mode would require pull-requests: read on this job.
          token: ''
          base: ${{ github.base_ref }}
          # Filter groups live in the shared file so the trusted automation
          # runtime classifies pull request paths against the same definitions.
          filters: .github/change-filters.yml

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

  clippy_gateway:
    name: Clippy (Gateway)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy -p aether-gateway --lib --bins --examples -- -D warnings

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  clippy_data:
    name: Clippy (Data)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy -p aether-data --all-targets -- -D warnings

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  clippy_rest:
    name: Clippy (Workspace Rest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy --workspace --exclude aether-gateway --exclude aether-data --exclude aether-integration-tests --all-targets -- -D warnings

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs:
      - clippy_gateway
      - clippy_data
      - clippy_rest
    if: ${{ always() }}
    steps:
      - name: Verify clippy jobs
        # Skipped jobs satisfy the gate: their changes filter did not match.
        run: |
          if [ "${{ needs.clippy_gateway.result }}" = "failure" ] || [ "${{ needs.clippy_gateway.result }}" = "cancelled" ] || \
             [ "${{ needs.clippy_data.result }}" = "failure" ] || [ "${{ needs.clippy_data.result }}" = "cancelled" ] || \
             [ "${{ needs.clippy_rest.result }}" = "failure" ] || [ "${{ needs.clippy_rest.result }}" = "cancelled" ]; then
            echo "Clippy failed"
            exit 1
          fi

  test_gateway:
    name: Test (Gateway)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Test lib
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          RUST_MIN_STACK: "16777216"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo nextest run -p aether-gateway --lib

      - name: Test bin
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          RUST_MIN_STACK: "16777216"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo nextest run -p aether-gateway --bins

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test_data:
    name: Test (Data)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo nextest run -p aether-data

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  check_data_features:
    name: Check (Data Feature - ${{ matrix.feature }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        feature:
          - postgres
          - mysql
          - sqlite
          - all-drivers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check selected data driver
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo check -p aether-data --no-default-features --features ${{ matrix.feature }}

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test_rest:
    name: Test (Workspace Rest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo nextest run --workspace --exclude aether-gateway --exclude aether-data --exclude aether-integration-tests

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test_data_adapters:
    name: Test (Data Adapter - ${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - aether-data-postgres
          - aether-data-mysql
          - aether-data-sqlite
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Test adapter
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo nextest run -p ${{ matrix.package }}

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  check_integration_scenarios:
    name: Test (Integration Scenarios)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Test scenario binaries
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test -p aether-integration-tests --bins --tests

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - test_gateway
      - test_data
      - check_data_features
      - test_rest
      - test_data_adapters
      - check_integration_scenarios
    if: ${{ always() }}
    steps:
      - name: Verify test jobs
        # Skipped jobs satisfy the gate: their changes filter did not match.
        run: |
          if [ "${{ needs.test_gateway.result }}" = "failure" ] || [ "${{ needs.test_gateway.result }}" = "cancelled" ] || \
             [ "${{ needs.test_data.result }}" = "failure" ] || [ "${{ needs.test_data.result }}" = "cancelled" ] || \
             [ "${{ needs.check_data_features.result }}" = "failure" ] || [ "${{ needs.check_data_features.result }}" = "cancelled" ] || \
             [ "${{ needs.test_rest.result }}" = "failure" ] || [ "${{ needs.test_rest.result }}" = "cancelled" ] || \
             [ "${{ needs.test_data_adapters.result }}" = "failure" ] || [ "${{ needs.test_data_adapters.result }}" = "cancelled" ] || \
             [ "${{ needs.check_integration_scenarios.result }}" = "failure" ] || [ "${{ needs.check_integration_scenarios.result }}" = "cancelled" ]; then
            echo "Tests failed"
            exit 1
          fi

  data_db_smoke_sqlite:
    name: Data DB Smoke (SQLite)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run SQLite data smoke tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test -p aether-data --all-features sqlite --lib

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  data_db_smoke_postgres:
    name: Data DB Smoke (Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aether_test
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U aether -d aether_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Add PostgreSQL server binaries to PATH
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Run Postgres migration smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features postgres_migrations_create_core_config_tables_when_url_is_set --lib -- --nocapture

      - name: Run Postgres provider metadata migration smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features postgres_provider_upstream_metadata_migration_preserves_json_when_url_is_set --lib -- --nocapture

      - name: Run Postgres API key lifecycle tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_REQUIRE_LOCAL_POSTGRES_TESTS: "true"
        run: |
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_request_candidates_preserve_deleted_api_key_identity --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_request_candidate_migration_decouples_legacy_api_key_foreign_key --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_stats_daily_api_key_migration_decouples_legacy_foreign_key --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_expired_api_key_cleanup_preserves_historical_identity --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_api_key_leaderboard_user_filter_preserves_aggregate_history --lib -- --exact --nocapture

      - name: Run Postgres core export smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features postgres_core_export_reads_migrated_database_rows_when_url_is_set --lib -- --nocapture

      - name: Run SQLite-to-Postgres import smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features sqlite_core_export_reads_migrated_database_rows --lib -- --nocapture

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  data_db_smoke_mysql:
    name: Data DB Smoke (MySQL)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.data == 'true' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aether_test
          MYSQL_USER: aether
          MYSQL_PASSWORD: aether
          MYSQL_ROOT_PASSWORD: aether_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uaether -paether --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run MySQL migration smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data --all-features mysql_migrations_create_core_config_tables_when_url_is_set --lib -- --nocapture

      - name: Run MySQL usage write smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data-mysql mysql_usage_write_repository_upserts_and_flushes_counters_when_url_is_set --lib -- --nocapture

      - name: Run MySQL usage read smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data-mysql mysql_usage_read_repository_reads_usage_contract_views_when_url_is_set --lib -- --nocapture

      - name: Run MySQL provider catalog smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data-mysql mysql_provider_catalog_repository_round_trips_when_url_is_set --lib -- --nocapture

      - name: Run MySQL core export smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data --all-features mysql_core_export_reads_migrated_database_rows_when_url_is_set --lib -- --nocapture

      - name: Run MySQL wallet read smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data-mysql mysql_wallet_read_repository_reads_wallet_contract_views --lib -- --nocapture

      - name: Run MySQL wallet daily usage aggregation smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data --all-features mysql_wallet_daily_usage_aggregation_uses_settlement_wallets_when_url_is_set --lib -- --nocapture

      - name: Run MySQL stats aggregation smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_MYSQL_URL: mysql://aether:aether@127.0.0.1:3306/aether_test
        run: cargo test -p aether-data --all-features mysql_stats_aggregation_runs_after_mysql_migrations_when_url_is_set --lib -- --nocapture

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  data_db_smoke:
    name: Data DB Smoke
    runs-on: ubuntu-latest
    needs:
      - data_db_smoke_sqlite
      - data_db_smoke_postgres
      - data_db_smoke_mysql
    if: ${{ always() }}
    steps:
      - name: Verify database smoke jobs
        # Skipped jobs satisfy the gate: their changes filter did not match.
        run: |
          if [ "${{ needs.data_db_smoke_sqlite.result }}" = "failure" ] || [ "${{ needs.data_db_smoke_sqlite.result }}" = "cancelled" ] || \
             [ "${{ needs.data_db_smoke_postgres.result }}" = "failure" ] || [ "${{ needs.data_db_smoke_postgres.result }}" = "cancelled" ] || \
             [ "${{ needs.data_db_smoke_mysql.result }}" = "failure" ] || [ "${{ needs.data_db_smoke_mysql.result }}" = "cancelled" ]; then
            echo "Data DB smoke failed"
            exit 1
          fi

  check:
    name: Rust CI / check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - fmt
      - clippy
      - test
      - data_db_smoke
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        # Skipped jobs satisfy the gate: their changes filter did not match.
        run: |
          if [ "${{ needs.fmt.result }}" = "failure" ] || [ "${{ needs.fmt.result }}" = "cancelled" ] || \
             [ "${{ needs.clippy.result }}" = "failure" ] || [ "${{ needs.clippy.result }}" = "cancelled" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test.result }}" = "cancelled" ] || \
             [ "${{ needs.data_db_smoke.result }}" = "failure" ] || [ "${{ needs.data_db_smoke.result }}" = "cancelled" ]; then
            echo "Rust CI failed"
            exit 1
          fi

  publish_dispatch_status:
    name: Publish dispatch status
    runs-on: ubuntu-latest
    needs: check
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish Rust CI status
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          result=success
          if [ "${CHECK_RESULT}" != "success" ]; then
            result=failure
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${result}" \
            -f context="Rust CI / check" \
            -f description="Rust CI ${result}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

name: Rust CI

on:
  workflow_call:
    inputs:
      force_full:
        description: Run the full Rust/DB graph for reusable workflow callers.
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/**"
      - "Dockerfile.app.local"
      - "frontend/vite.config.ts"
      - "frontend/src/**"
      - "docs/api/**"
      - "docs/operations/referral-rebate-numeric-audit.sql"
      - "docs/operations/fixtures/**"
      - ".github/change-filters.yml"
      - "install.sh"
      - "deploy.sh"
      - "update.sh"
      - "generate_keys.sh"
      - ".env.example"
      - "README.md"
      - "Dockerfile.app"
      - "docker-compose.yml"
      - "docker-compose.single-node.yml"
      - "docker-compose.redis-durable.yml"
      - "docker-compose.local.yml"
      - "docker-compose.release-local.yml"
      - "docs/operations/prometheus/**"
      - "tests/**"
      - "tools/ci/**"
      - ".github/workflows/build-tunnel.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/prometheus-ci.yml"
  pull_request:

concurrency:
  group: rust-ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # Reusable calls retain the caller event name, so their default input
      # requests full validation even when called by a pull_request workflow.
      # Missing direct-PR outputs stay empty and fail the aggregate gates.
      rust: ${{ (inputs.force_full || github.event_name != 'pull_request') && 'true' || steps.filter.outputs.rust }}
      data: ${{ (inputs.force_full || github.event_name != 'pull_request') && 'true' || steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: ${{ github.event_name == 'pull_request' && !inputs.force_full }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        if: ${{ github.event_name == 'pull_request' && !inputs.force_full }}
        with:
          token: ''
          base: ${{ github.base_ref }}
          filters: .github/change-filters.yml

  shell_security:
    name: Shell security fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run installer and supply-chain fixtures
        shell: bash
        run: |
          python3 tests/compose_database_config_test.py
          python3 tests/gateway_env_reference_test.py
          bash tests/deploy_state_safety_test.sh
          bash tests/install_archive_safety_test.sh
          bash tests/install_container_runtime_security_test.sh
          bash tests/install_current_release_link_test.sh
          bash tests/install_local_bundle_safety_test.sh
          bash tests/install_privileged_write_safety_test.sh
          bash tests/install_source_trust_test.sh
          bash tests/release_supply_chain_test.sh
          bash tests/update_compose_safety_test.sh
          bash tests/tunnel_installer_config_security_test.sh
          bash tests/cargo_audit_gate_test.sh

      - name: Redis durable crash drill
        shell: bash
        run: |
          mkdir -p artifacts/redis-durable
          bash tests/redis_durable_crash_drill.sh 2>&1 | tee artifacts/redis-durable/crash-drill.log

      - name: Upload Redis durable crash drill evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: redis-durable-crash-drill
          path: artifacts/redis-durable/
          if-no-files-found: warn
          retention-days: 14

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

  clippy_gateway:
    name: Clippy (Gateway)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy -p aether-gateway --lib --bins --examples -- -D warnings

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  clippy_data:
    name: Clippy (Data)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy -p aether-data --all-targets -- -D warnings

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  clippy_rest:
    name: Clippy (Workspace Rest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy --workspace --exclude aether-gateway --exclude aether-data --exclude aether-integration-tests --all-targets -- -D warnings

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs:
      - changes
      - clippy_gateway
      - clippy_data
      - clippy_rest
    if: ${{ always() }}
    steps:
      - name: Verify clippy jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          JOB_RESULTS: >-
            clippy_gateway=${{ needs.clippy_gateway.result }}
            clippy_data=${{ needs.clippy_data.result }}
            clippy_rest=${{ needs.clippy_rest.result }}
        run: |
          case "$CHANGES_RESULT:$RUST_CHANGED" in
            success:true) expected=success ;;
            success:false) expected=skipped ;;
            *) echo "Change detection failed or returned an invalid Rust scope"; exit 1 ;;
          esac
          for job_result in $JOB_RESULTS; do
            if [ "${job_result#*=}" != "$expected" ]; then
              echo "Unexpected result: $job_result (expected $expected)"
              exit 1
            fi
          done

  test_gateway:
    name: Test (Gateway)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Setup mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Expose PostgreSQL test binaries
        run: pg_config --bindir >> "$GITHUB_PATH"

      - name: Test lib
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          RUST_MIN_STACK: "16777216"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo nextest run -p aether-gateway --lib

      - name: Test bins
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          RUST_MIN_STACK: "16777216"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo nextest run -p aether-gateway --bins

      - name: Install readiness drill dependencies
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Build gateway and run isolated readiness drill
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          RUST_MIN_STACK: "16777216"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          AETHER_READINESS_EVIDENCE_DIR: ${{ runner.temp }}/readiness-evidence
        run: |
          cargo build --locked -p aether-gateway --bin aether-gateway
          AETHER_GATEWAY_BIN="$PWD/target/debug/aether-gateway" bash tools/ci/run_readiness_drill.sh

      - name: Upload readiness withdrawal and recovery evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v7
        with:
          name: readiness-withdrawal-recovery
          path: ${{ runner.temp }}/readiness-evidence
          if-no-files-found: warn

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test_data:
    name: Test (Data)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Expose PostgreSQL test binaries
        run: pg_config --bindir >> "$GITHUB_PATH"

      - name: Test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_REQUIRE_LOCAL_POSTGRES_TESTS: "true"
        run: cargo nextest run -p aether-data

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  check_data_features:
    name: Check (Data Feature - ${{ matrix.feature }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        feature:
          - postgres
          - all-drivers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Check selected data driver
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo check -p aether-data --no-default-features --features ${{ matrix.feature }}

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test_rest:
    name: Test (Workspace Rest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Install Redis for isolated runtime tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Run strict Redis runtime tests and negative probes
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_REQUIRE_LOCAL_REDIS_TESTS: "1"
        run: bash tools/ci/run_redis_live_tests.sh

      - name: Upload Redis runtime test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: redis-runtime-tests
          path: artifacts/redis-runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo nextest run --workspace --exclude aether-gateway --exclude aether-data --exclude aether-integration-tests --exclude aether-runtime-state

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test_data_adapters:
    name: Test (Data Adapter - ${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - aether-data-postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install nextest
        uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest

      - name: Test adapter
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo nextest run -p ${{ matrix.package }}

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  check_integration_scenarios:
    name: Test (Integration Scenarios)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Expose PostgreSQL test binaries
        run: pg_config --bindir >> "$GITHUB_PATH"

      - name: Test scenario binaries and end-to-end suites
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test -p aether-integration-tests --bins --tests

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - changes
      - test_gateway
      - test_data
      - check_data_features
      - test_rest
      - test_data_adapters
      - check_integration_scenarios
    if: ${{ always() }}
    steps:
      - name: Verify test jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          JOB_RESULTS: >-
            test_gateway=${{ needs.test_gateway.result }}
            test_data=${{ needs.test_data.result }}
            check_data_features=${{ needs.check_data_features.result }}
            test_rest=${{ needs.test_rest.result }}
            test_data_adapters=${{ needs.test_data_adapters.result }}
            check_integration_scenarios=${{ needs.check_integration_scenarios.result }}
        run: |
          case "$CHANGES_RESULT:$RUST_CHANGED" in
            success:true) expected=success ;;
            success:false) expected=skipped ;;
            *) echo "Change detection failed or returned an invalid Rust scope"; exit 1 ;;
          esac
          for job_result in $JOB_RESULTS; do
            if [ "${job_result#*=}" != "$expected" ]; then
              echo "Unexpected result: $job_result (expected $expected)"
              exit 1
            fi
          done

  data_db_smoke_postgres:
    name: Data DB Smoke (Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aether_test
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U aether -d aether_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Add PostgreSQL server binaries to PATH
        run: pg_config --bindir >> "$GITHUB_PATH"

      - name: Run Postgres migration smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features postgres_migrations_create_core_config_tables_when_url_is_set --lib -- --nocapture

      - name: Run Postgres provider metadata migration smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features postgres_provider_upstream_metadata_migration_preserves_json_when_url_is_set --lib -- --nocapture

      - name: Run Postgres payment callback regression tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_DATABASE_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data-postgres live_payment_callback --lib -- --ignored --nocapture

      - name: Run Postgres API key lifecycle tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_REQUIRE_LOCAL_POSTGRES_TESTS: "true"
        run: |
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_request_candidates_preserve_deleted_api_key_identity --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_request_candidate_migration_decouples_legacy_api_key_foreign_key --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_stats_daily_api_key_migration_decouples_legacy_foreign_key --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_expired_api_key_cleanup_preserves_historical_identity --lib -- --exact --nocapture
          cargo test -p aether-data --all-features lifecycle::migrate::tests::postgres_api_key_leaderboard_user_filter_preserves_aggregate_history --lib -- --exact --nocapture

      - name: Run Postgres core export smoke test
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_TEST_POSTGRES_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: cargo test -p aether-data --all-features postgres_core_export_reads_migrated_database_rows_when_url_is_set --lib -- --nocapture

      - name: Run historical referral NUMERIC audit regression
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          AETHER_REQUIRE_LOCAL_POSTGRES_TESTS: "true"
        run: cargo test -p aether-data --all-features postgres_referral_numeric_audit_detects_missing_and_incorrect_credits --lib -- --nocapture

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: sccache --show-stats

  data_db_smoke:
    name: Data DB Smoke
    runs-on: ubuntu-latest
    needs:
      - changes
      - data_db_smoke_postgres
    if: ${{ always() }}
    steps:
      - name: Verify database smoke jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          JOB_RESULTS: data_db_smoke_postgres=${{ needs.data_db_smoke_postgres.result }}
        run: |
          case "$CHANGES_RESULT:$RUST_CHANGED" in
            success:true) expected=success ;;
            success:false) expected=skipped ;;
            *) echo "Change detection failed or returned an invalid Rust scope"; exit 1 ;;
          esac
          for job_result in $JOB_RESULTS; do
            if [ "${job_result#*=}" != "$expected" ]; then
              echo "Unexpected result: $job_result (expected $expected)"
              exit 1
            fi
          done

  data_db_ignored_postgres:
    name: Data DB Live (selected ignored tests)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.rust == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aether_test
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U aether -d aether_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-ci-${{ runner.os }}
          workspaces: . -> target

      - name: Add PostgreSQL client binaries to PATH
        run: pg_config --bindir >> "$GITHUB_PATH"

      - name: Run selected isolated live-DB tests
        env:
          AETHER_TEST_DATABASE_URL: postgres://aether:aether@127.0.0.1:5432/aether_test
        run: bash tools/ci/run_postgres_live_tests.sh

  prometheus_contracts:
    uses: ./.github/workflows/prometheus-ci.yml

  check:
    name: Rust CI / check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - changes
      - fmt
      - clippy
      - test
      - data_db_smoke
      - data_db_ignored_postgres
      - shell_security
      - prometheus_contracts
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          JOB_RESULTS: >-
            fmt=${{ needs.fmt.result }}
            data_db_ignored_postgres=${{ needs.data_db_ignored_postgres.result }}
          REQUIRED_JOB_RESULTS: >-
            clippy=${{ needs.clippy.result }}
            test=${{ needs.test.result }}
            data_db_smoke=${{ needs.data_db_smoke.result }}
            shell_security=${{ needs.shell_security.result }}
            prometheus_contracts=${{ needs.prometheus_contracts.result }}
        run: |
          case "$CHANGES_RESULT:$RUST_CHANGED" in
            success:true) expected=success ;;
            success:false) expected=skipped ;;
            *) echo "Change detection failed or returned an invalid Rust scope"; exit 1 ;;
          esac
          for job_result in $JOB_RESULTS; do
            if [ "${job_result#*=}" != "$expected" ]; then
              echo "Unexpected result: $job_result (expected $expected)"
              exit 1
            fi
          done
          for job_result in $REQUIRED_JOB_RESULTS; do
            if [ "${job_result#*=}" != "success" ]; then
              echo "Required job did not succeed: $job_result"
              exit 1
            fi
          done

  publish_dispatch_status:
    name: Publish dispatch status
    runs-on: ubuntu-latest
    needs: check
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish Rust CI status
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          result=success
          if [ "${CHECK_RESULT}" != "success" ]; then
            result=failure
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${result}" \
            -f context="Rust CI / check" \
            -f description="Rust CI ${result}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

name: Sync upstream

on:
  schedule:
    # 05:00 Asia/Shanghai (21:00 UTC on the previous day).
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      resume:
        description: Resume after a maintainer closed the managed sync PR
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream / create PR
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    env:
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: main
      SYNC_BRANCH: automation/sync-upstream
      RESUME: ${{ inputs.resume || 'false' }}
    steps:
      - name: Check out fork default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Build and publish automation branch
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/workflows/scripts/sync-upstream.sh

      - name: Ensure required checks are dispatched
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNCED_SHA: ${{ steps.sync.outputs.synced_sha }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_check() {
            local workflow="$1" context="$2" attempt check_active status_active run_active
            for attempt in 1 2 3 4 5 6; do
              check_active="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SYNCED_SHA}/check-runs?per_page=100" \
                --jq "[.check_runs[] | select(.name == \"${context}\")] | sort_by(.started_at // .completed_at // .created_at) | last // {} | if .status == null then false elif (.status != \"completed\" or .conclusion == \"success\") then true else false end")"
              status_active="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SYNCED_SHA}/status" \
                --jq "[.statuses[] | select(.context == \"${context}\")] | sort_by(.created_at) | last // {} | if .state == \"success\" or .state == \"pending\" then true else false end")"
              run_active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${SYNCED_SHA}&per_page=100" \
                --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length > 0')"
              if [[ "${check_active}" == true || "${status_active}" == true || "${run_active}" == true ]]; then
                echo "${context}: an active or successful result already exists"
                return
              fi
              ((attempt == 6)) && break
              sleep 5
            done

            # The PR event normally wins during the polling window. Dispatch is
            # the fallback for token-created PRs that do not emit that event.
            gh workflow run --repo "${GITHUB_REPOSITORY}" "${workflow}" --ref "${SYNC_BRANCH}"
            echo "${context}: fallback workflow_dispatch created"
          }

          ensure_check rust-ci.yml "Rust CI / check"
          ensure_check frontend-ci.yml "Frontend CI / check"

      - name: Write summary
        if: always()
        env:
          STATE: ${{ steps.sync.outputs.state }}
          HAS_CHANGES: ${{ steps.sync.outputs.has_changes }}
          PARENT: ${{ steps.sync.outputs.parent }}
          UPSTREAM_BRANCH: ${{ steps.sync.outputs.upstream_branch }}
          PR_URL: ${{ steps.sync.outputs.pr_url }}
        shell: bash
        run: |
          {
            echo "### Upstream sync"
            echo
            echo "- Source: \`${PARENT:-unknown}:${UPSTREAM_BRANCH:-unknown}\`"
            echo "- State: \`${STATE:-failed}\`"
            echo "- Changes found: \`${HAS_CHANGES:-unknown}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- Pull request: ${PR_URL}"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

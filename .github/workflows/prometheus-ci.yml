name: Prometheus Contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prometheus-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Prometheus Contracts / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: prometheus-contracts-${{ runner.os }}
      - name: Install verified Prometheus tooling
        shell: bash
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/aeris-prometheus.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            --output "$tool_dir/prometheus.tar.gz"
          printf '%s  %s\n' \
            f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d \
            "$tool_dir/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/prometheus.tar.gz" -C "$tool_dir" \
            prometheus-3.14.0.linux-amd64/promtool
          echo "$tool_dir/prometheus-3.14.0.linux-amd64" >> "$GITHUB_PATH"
      - name: Validate real exposition and alert lifecycle
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/prometheus-evidence"
          promtool --version | tee "$RUNNER_TEMP/prometheus-evidence/version.txt"
          cargo run --locked --quiet -p aether-runtime --example prometheus_billing_fixture \
            > "$RUNNER_TEMP/prometheus-evidence/billing.prom"
          promtool check metrics < "$RUNNER_TEMP/prometheus-evidence/billing.prom" \
            2>&1 | tee "$RUNNER_TEMP/prometheus-evidence/metrics.txt"
          promtool check rules docs/operations/prometheus/aether-alerts.yml \
            2>&1 | tee "$RUNNER_TEMP/prometheus-evidence/rules.txt"
          promtool test rules docs/operations/prometheus/aether-alerts.test.yml \
            2>&1 | tee "$RUNNER_TEMP/prometheus-evidence/alert-lifecycle.txt"
      - name: Upload reproducible validation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: prometheus-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/prometheus-evidence/
          if-no-files-found: error
          retention-days: 14

name: Automation Policy Gate

on:
  workflow_run:
    workflows: [Rust CI, Frontend CI, Policy Signal]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to evaluate; omit to reconcile all open PRs
        required: false
        type: number

permissions:
  contents: read

jobs:
  discover:
    name: Discover policy targets
    if: >-
      (vars.AERIS_AGENTS_ENABLED == 'true' || vars.AERIS_AGENTS_ENABLED == '1') &&
      (vars.AERIS_POLICY_ENABLED == 'true' || vars.AERIS_POLICY_ENABLED == '1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve bounded target set
        id: targets
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v8
        with:
          script: |
            const eventName = context.eventName;
            let numbers = [];
            if (eventName === 'workflow_run') {
              const number = context.payload.workflow_run?.pull_requests?.[0]?.number;
              if (Number.isSafeInteger(number) && number > 0) numbers = [number];
            } else if (eventName === 'workflow_dispatch' && context.payload.inputs?.pull_request_number) {
              const number = Number(context.payload.inputs.pull_request_number);
              if (!Number.isSafeInteger(number) || number < 1) throw new Error('invalid pull request number');
              numbers = [number];
            } else {
              const response = await github.request('GET /repos/{owner}/{repo}/pulls', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: context.payload.repository.default_branch,
                per_page: 100,
                page: 1,
              });
              if (String(response.headers.link ?? '').includes('rel="next"')) {
                throw new Error('more than 100 open pull requests; refusing truncated reconciliation');
              }
              numbers = response.data.map((pull) => pull.number);
            }
            numbers = [...new Set(numbers)].sort((left, right) => left - right);
            if (numbers.length > 100) throw new Error('policy target set exceeds 100 pull requests');
            core.setOutput('targets', JSON.stringify(numbers.map((pull_request_number) => ({ pull_request_number }))));

  evaluate:
    name: Evaluate PR #${{ matrix.pull_request_number }}
    needs: [discover]
    if: always() && needs.discover.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: policy-evaluate-${{ github.event.repository.id }}-${{ matrix.pull_request_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install trusted automation runtime
        working-directory: .github/automation
        run: npm ci --ignore-scripts

      - name: Evaluate live policy inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AERIS_AGENTS_ENABLED: ${{ vars.AERIS_AGENTS_ENABLED }}
          AERIS_POLICY_ENABLED: ${{ vars.AERIS_POLICY_ENABLED }}
          AERIS_REPOSITORY_ID: ${{ github.event.repository.id }}
          AERIS_PULL_REQUEST_NUMBER: ${{ matrix.pull_request_number }}
          AERIS_EXPECTED_HEAD_SHA: ""
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-policy/evaluation.json
        run: node .github/automation/src/run-policy-gate.mjs evaluate

      - name: Upload policy evaluation
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: policy-evaluation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pull_request_number }}
          path: ${{ runner.temp }}/aeris-policy/evaluation.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish PR #${{ matrix.pull_request_number }} policy check
    needs: [discover]
    if: needs.discover.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: policy-gate-${{ github.event.repository.id }}-${{ matrix.pull_request_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: policy
    permissions:
      contents: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install trusted automation runtime
        working-directory: .github/automation
        run: npm ci --ignore-scripts

      - name: Mint bounded Policy App token
        id: policy_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AERIS_POLICY_APP_ID }}
          private-key: ${{ secrets.AERIS_POLICY_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write

      - name: Publish exact-head policy check
        env:
          AERIS_POLICY_TOKEN: ${{ steps.policy_token.outputs.token }}
          AERIS_AGENTS_ENABLED: ${{ vars.AERIS_AGENTS_ENABLED }}
          AERIS_POLICY_ENABLED: ${{ vars.AERIS_POLICY_ENABLED }}
          AERIS_POLICY_APP_ID: ${{ vars.AERIS_POLICY_APP_ID }}
          AERIS_POLICY_APP_SLUG: ${{ vars.AERIS_POLICY_APP_SLUG }}
          AERIS_REPOSITORY_ID: ${{ github.event.repository.id }}
          AERIS_PULL_REQUEST_NUMBER: ${{ matrix.pull_request_number }}
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-policy/receipt.json
        run: node .github/automation/src/run-policy-gate.mjs publish

      - name: Upload policy receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: policy-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pull_request_number }}
          path: ${{ runner.temp }}/aeris-policy/receipt.json
          if-no-files-found: error
          retention-days: 7

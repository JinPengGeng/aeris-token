name: AI Endpoint Probe

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: AI base URL to probe
        required: true
        default: https://token.fengying.tech/v1

permissions:
  contents: read

jobs:
  probe:
    name: Probe AI endpoint connectivity
    runs-on: ubuntu-latest
    steps:
      - name: DNS and TLS probe
        shell: bash
        run: |
          set -euo pipefail
          url="${{ inputs.base_url }}/models"
          echo "--- getent hosts ---"
          getent hosts "$(printf '%s' "${{ inputs.base_url }}" | sed -E 's#https?://([^/]+).*#\1#')" || true
          echo "--- curl (20s budget) ---"
          curl -sS -o /tmp/body.json -w "HTTP %{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
            --connect-timeout 10 --max-time 20 "$url" || true
          echo "--- response head ---"
          head -c 400 /tmp/body.json || true

name: Agent PR Review

on:
  workflow_run:
    workflows: [Rust CI, Frontend CI]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: number
      agent:
        description: Read-only agent
        required: true
        type: choice
        options:
          - review

permissions:
  contents: read

# Serialize workflow_run reviews for the same PR head so each completed event
# can reevaluate the live required checks after an older run releases its
# reservation. Manual and comment commands keep independent run-specific groups.
concurrency:
  group: agent-pr-run-${{ github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.head_sha) || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate PR invocation
    if: >-
      ((vars.AERIS_AGENTS_ENABLED == 'true' || vars.AERIS_AGENTS_ENABLED == '1') ||
       (github.event_name == 'issue_comment' &&
        (github.event.comment.body == '/agent status' ||
         github.event.comment.body == '/agent cancel' ||
         github.event.comment.body == '/agent Status' ||
         github.event.comment.body == '/agent STATUS' ||
         github.event.comment.body == '/agent Cancel' ||
         github.event.comment.body == '/agent CANCEL'))) &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.pull_requests[0].number) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.actor != 'github-actions[bot]') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install trusted automation runtime
        working-directory: .github/automation
        run: npm ci --ignore-scripts

      - name: Run preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AERIS_PHASE: preflight
          AERIS_OBJECT_KIND: pull_request
          AERIS_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number || '' }}
          AERIS_AGENT: ${{ inputs.agent || '' }}
          AERIS_AGENTS_ENABLED: ${{ vars.AERIS_AGENTS_ENABLED }}
          AERIS_AI_API_KEY_PRESENT: ${{ secrets.AERIS_AI_API_KEY != '' && 'true' || 'false' }}
          AERIS_AI_BASE_URL: ${{ vars.AERIS_AI_BASE_URL }}
          AERIS_AI_MODEL: ${{ vars.AERIS_AI_MODEL }}
          AERIS_AI_MODEL_REVIEWER: ${{ vars.AERIS_AI_MODEL_REVIEWER }}
          AERIS_AI_MODEL_FALLBACK: ${{ vars.AERIS_AI_MODEL_FALLBACK }}
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-preflight/preflight.json
        run: node .github/automation/src/run-phase.mjs preflight

      - name: Upload preflight artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pr-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aeris-preflight/preflight.json
          if-no-files-found: error
          retention-days: 1

  reserve:
    name: Reserve PR review
    needs: [preflight]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: agent-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pull_request_number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install trusted automation runtime
        working-directory: .github/automation
        run: npm ci --ignore-scripts

      - name: Download preflight artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pr-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aeris-preflight

      - name: Reserve managed comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AERIS_PHASE: reserve
          AERIS_OBJECT_KIND: pull_request
          AERIS_INPUT_PATH: ${{ runner.temp }}/aeris-preflight/preflight.json
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-reservation/reservation.json
        run: node .github/automation/src/run-phase.mjs reserve

      - name: Upload reservation artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pr-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aeris-reservation/reservation.json
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Analyze PR
    needs: [reserve]
    if: always() && needs.reserve.result == 'success'
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install trusted automation runtime
        working-directory: .github/automation
        run: npm ci --ignore-scripts

      - name: Download reservation artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pr-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aeris-reservation

      - name: Read reservation state
        id: read_reservation
        shell: bash
        run: |
          state="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(value.state)" "$RUNNER_TEMP/aeris-reservation/reservation.json")"
          case "$state" in reserved|terminal) ;; *) exit 1 ;; esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Run reserved analysis
        if: ${{ steps.read_reservation.outputs.state == 'reserved' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AERIS_PHASE: analyze
          AERIS_OBJECT_KIND: pull_request
          AERIS_AGENTS_ENABLED: ${{ vars.AERIS_AGENTS_ENABLED }}
          AERIS_INPUT_PATH: ${{ runner.temp }}/aeris-reservation/reservation.json
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-analysis/analysis.json
          AERIS_AI_BASE_URL: ${{ vars.AERIS_AI_BASE_URL }}
          AERIS_AI_API_KEY: ${{ secrets.AERIS_AI_API_KEY }}
          AERIS_AI_MODEL: ${{ vars.AERIS_AI_MODEL }}
          AERIS_AI_MODEL_REVIEWER: ${{ vars.AERIS_AI_MODEL_REVIEWER }}
          AERIS_AI_MODEL_FALLBACK: ${{ vars.AERIS_AI_MODEL_FALLBACK }}
        run: node .github/automation/src/run-phase.mjs analyze

      - name: Pass through terminal reservation
        if: ${{ steps.read_reservation.outputs.state != 'reserved' }}
        env:
          AERIS_PHASE: analyze
          AERIS_OBJECT_KIND: pull_request
          AERIS_INPUT_PATH: ${{ runner.temp }}/aeris-reservation/reservation.json
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-analysis/analysis.json
        run: node .github/automation/src/run-phase.mjs analyze

      - name: Upload analysis artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pr-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aeris-analysis/analysis.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish PR review
    needs: [analyze]
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    concurrency:
      group: agent-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pull_request_number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install trusted automation runtime
        working-directory: .github/automation
        run: npm ci --ignore-scripts

      - name: Download analysis artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pr-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aeris-analysis

      - name: Publish managed comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AERIS_PHASE: publish
          AERIS_OBJECT_KIND: pull_request
          AERIS_INPUT_PATH: ${{ runner.temp }}/aeris-analysis/analysis.json
          AERIS_OUTPUT_PATH: ${{ runner.temp }}/aeris-publish/publish-result.json
        run: node .github/automation/src/run-phase.mjs publish

name: Pressure Baseline Dry-Run

# Small-scale dry-run of the S1 pressure harness against a real gateway +
# Postgres + Redis + mock upstream. It exists to keep the pressure toolchain
# (probe driver, stage checker, seed, mock upstream) working in CI and to
# produce a report artifact. It is NOT the capacity gate: the S1-S5/TPS hard
# thresholds (1000 rps floor etc.) are only meaningful on dedicated load
# hardware; see tools/pressure/README.md for the full procedure.
on:
  # 03:23 UTC every Sunday.
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pressure-baseline
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GATEWAY_DATA_POSTGRES_URL: postgresql://postgres:aether@127.0.0.1:5432/aether
  GATEWAY_RUNTIME_REDIS_URL: redis://127.0.0.1:6379
  GATEWAY_ENCRYPTION_KEY: pressure-dry-run-encryption-key-0123456789abcdef
  GATEWAY_JWT_SECRET: pressure-dry-run-jwt-secret-0123456789abcdef0123456789abcdef

jobs:
  s1-dry-run:
    name: S1 dry-run (small scale)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: pressure-dry-run
          workspaces: . -> target

      # Debug profile on purpose: this job validates the harness end-to-end,
      # it does not measure performance.
      - name: Build gateway, probe, seed and mock upstream
        run: >-
          cargo build --locked
          -p aether-gateway
          -p aether-loadtools
          -p aether-integration-tests

      - name: Start mock upstream
        run: >-
          nohup ./target/debug/mock_openai_upstream
          --chunks 4
          --chunk-delay-ms 5
          --first-byte-delay-ms 20
          >/tmp/mock_upstream.log 2>&1 &

      - name: Start gateway
        env:
          AETHER_GATEWAY_DATA_POSTGRES_URL: ${{ env.GATEWAY_DATA_POSTGRES_URL }}
          AETHER_GATEWAY_DATA_ENCRYPTION_KEY: ${{ env.GATEWAY_ENCRYPTION_KEY }}
          AETHER_RUNTIME_REDIS_URL: ${{ env.GATEWAY_RUNTIME_REDIS_URL }}
          JWT_SECRET_KEY: ${{ env.GATEWAY_JWT_SECRET }}
          ENCRYPTION_KEY: ${{ env.GATEWAY_ENCRYPTION_KEY }}
          RUST_LOG: info
        run: |
          set -euo pipefail
          nohup ./target/debug/aether-gateway >/tmp/aether_gateway.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8084/_gateway/health >/dev/null 2>&1; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "gateway failed to become healthy" >&2
          tail -n 80 /tmp/aether_gateway.log >&2 || true
          exit 1

      # The gateway boots with database_mode=auto, so the schema is created by
      # the health-wait above; seed then inserts the provider/key/model rows
      # the pressure probe needs.
      - name: Seed pressure fixtures
        env:
          DATABASE_URL: ${{ env.GATEWAY_DATA_POSTGRES_URL }}
        run: ./target/debug/gateway_pressure_seed

      - name: Run small-scale S1 probe (60 requests / 10 concurrency)
        env:
          PRESSURE_STAGE: S1
          PRESSURE_REQUESTS: '60'
          PRESSURE_CONCURRENCY: '10'
          PRESSURE_START_RAMP_MS: '2000'
          PRESSURE_FIRST_BODY_HOLD_MS: '500'
          PRESSURE_TIMEOUT_MS: '30000'
          PRESSURE_SETTLE_AFTER_MS: '30000'
          PRESSURE_CARGO_PROFILE: debug
          # The full M4 metric set requires host-level network/process
          # observability that a shared debug runner cannot guarantee; the
          # dedicated pressure environment runs preflight with the defaults.
          PRESSURE_REQUIRE_M4_METRICS: 'false'
          AETHER_API_KEY_FILE: /tmp/aether_fullchain_api_key
        run: ./tools/pressure/run_gateway_mock_streaming_stage.sh

      # The stage checker enforces S1 hard thresholds calibrated for 1000
      # requests at 1000 concurrency; at dry-run scale they are advisory. The
      # probe exit code above is the gate for this job.
      - name: Validate report structure (advisory thresholds)
        run: >-
          node tools/pressure/check_gateway_stage_report.js
          --stage S1
          --min-requests 60
          --min-concurrency 10
          /tmp/aether_gateway_pressure_s1_1k.json
        continue-on-error: true

      - name: Upload pressure report and gateway log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pressure-s1-dry-run
          path: |
            /tmp/aether_gateway_pressure_s1_1k.json
            /tmp/aether_gateway.log
            /tmp/mock_upstream.log
          if-no-files-found: warn
          retention-days: 14

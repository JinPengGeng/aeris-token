name: Release aeris-token

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_approval_canary:
        description: Confirm the release Environment approval boundary without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-aeris-token-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ vars.GHCR_IMAGE || github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.classify.outputs.publish }}
      version_tag: ${{ steps.classify.outputs.version_tag }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      make_latest: ${{ steps.classify.outputs.make_latest }}
    steps:
      - name: Classify release tag
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          echo "publish=false" >> "${GITHUB_OUTPUT}"
          echo "version_tag=" >> "${GITHUB_OUTPUT}"
          echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          echo "make_latest=false" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual release build; publish jobs will be skipped."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            echo "Expected vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-rc.N." >&2
            exit 1
          fi

          echo "version_tag=${tag}" >> "${GITHUB_OUTPUT}"

          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "make_latest=true" >> "${GITHUB_OUTPUT}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Manual release build for ${tag}; publish jobs will be skipped."
          fi

  release-approval-canary:
    name: Release approval canary
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_approval_canary == true &&
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.evidence.outputs.run_id }}
      ref: ${{ steps.evidence.outputs.ref }}
      sha: ${{ steps.evidence.outputs.sha }}
    steps:
      - name: Record immutable run and ref evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "ref=${GITHUB_REF}" >> "${GITHUB_OUTPUT}"
          echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Build frontend
    needs: preflight
    if: inputs.release_approval_canary != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    if: inputs.release_approval_canary != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
            os: ubuntu-latest
            use_cross: true
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            os: ubuntu-latest
            use_cross: true
          - name: macos-amd64
            target: x86_64-apple-darwin
            platform: macos
            arch: amd64
            os: macos-15-intel
            use_cross: false
          - name: macos-arm64
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            os: macos-15
            use_cross: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: . -> target

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@7a74ec2e18628d3a08d2fd4b55aea54cd5de1cfd # cross

      - name: Build
        env:
          AETHER_VERSION: ${{ needs.preflight.outputs.version_tag }}
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked -p aether-gateway --target ${{ matrix.target }}
          else
            cargo build --release --locked -p aether-gateway --target ${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aether-gateway-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish images and release assets
    environment: release
    permissions:
      contents: write
      packages: write
    needs: [preflight, frontend, build, package]
    if: >-
      inputs.release_approval_canary != true &&
      needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Classify optional Docker Hub publication
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "${GITHUB_OUTPUT}"
          # Keep metadata-action input valid even when Docker Hub is disabled.
          echo "image=${DOCKERHUB_IMAGE:-disabled/aeris-token}" >> "${GITHUB_OUTPUT}"

          if [[ -z "${DOCKERHUB_IMAGE}" ]]; then
            echo "Docker Hub publication disabled: repository variable DOCKERHUB_IMAGE is not configured."
          elif [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "Docker Hub publication disabled: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are both required."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub publication enabled for the configured image."
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Prepare dist layout
        run: |
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          cp artifacts/aether-gateway-linux-arm64/aether-gateway dist/aether-gateway-arm64
          chmod +x dist/aether-gateway-amd64 dist/aether-gateway-arm64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.GHCR_IMAGE }}
            name=docker.io/${{ steps.registry.outputs.image }},enable=${{ steps.registry.outputs.publish == 'true' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.make_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.make_latest == 'true' }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=rc,enable=${{ contains(github.ref_name, '-rc.') }}
            type=sha,prefix=
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Ported from YachDemo/Aether@1c7531db (.github/workflows/build-arm64.yml).
          # gha cache import failures never fail the build (cold build instead);
          # ignore-error on cache-to keeps cache export outages from failing the release.
          cache-from: type=gha,scope=aeris-token-app
          cache-to: type=gha,mode=max,ignore-error=true,scope=aeris-token-app
          provenance: mode=max
          sbom: true

      - name: Download release package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets

      - name: Delete stale draft releases for tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          draft_ids="$(gh api "repos/${REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft == true) | .id')"

          if [[ -z "${draft_ids}" ]]; then
            echo "No stale draft releases for ${RELEASE_TAG}"
            exit 0
          fi

          while IFS= read -r release_id; do
            [[ -z "${release_id}" ]] && continue
            echo "Deleting stale draft release ${release_id} for ${RELEASE_TAG}"
            gh api -X DELETE "repos/${REPOSITORY}/releases/${release_id}"
          done <<< "${draft_ids}"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/install.sh

  package:
    name: Release tarballs
    needs: [preflight, frontend, build]
    if: inputs.release_approval_canary != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Build release packages
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            SOURCE_REF="${GITHUB_REF_NAME}"
          else
            VERSION="snapshot-${GITHUB_SHA::7}"
            SOURCE_REF="${GITHUB_SHA}"
          fi

          mkdir -p package release-assets
          for platform in linux macos; do
            for arch in amd64 arm64; do
              bundle="aether-${VERSION}-${platform}-${arch}"
              root="package/${bundle}"
              mkdir -p \
                "${root}/bin" \
                "${root}/frontend"

              install -m 0755 "artifacts/aether-gateway-${platform}-${arch}/aether-gateway" "${root}/bin/aether-gateway"
              cp -R artifacts/frontend-dist/. "${root}/frontend/"
              sed \
                -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-main}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
                -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
                install.sh > "${root}/install.sh"
              chmod 0755 "${root}/install.sh"
              install -m 0755 update.sh "${root}/update.sh"
              install -m 0644 docker-compose.yml "${root}/docker-compose.yml"
              install -m 0644 docker-compose.single-node.yml "${root}/docker-compose.single-node.yml"
              install -m 0644 .env.example "${root}/.env.example"
              install -m 0755 generate_keys.sh "${root}/generate_keys.sh"
              install -m 0644 README.md "${root}/README.md"
              install -m 0644 LICENSE "${root}/LICENSE"

              tar -C package -czf "release-assets/${bundle}.tar.gz" "${bundle}"
            done
          done

          sed \
            -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-main}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
            -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
            install.sh > release-assets/install.sh
          chmod +x release-assets/install.sh
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)

      - name: Upload release package artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7


name: Data CI

# 数据层对账：generated schema 新鲜度（compose_schema.sh check）与
# 迁移 lint（金额列禁止 float8）。均为只读检查，不依赖数据库。

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "crates/aether-data/**"
      - "tests/migration_money_column_lint_test.sh"
      - ".github/workflows/data-ci.yml"
  pull_request:
    paths:
      - "crates/aether-data/**"
      - "tests/migration_money_column_lint_test.sh"
      - ".github/workflows/data-ci.yml"

concurrency:
  group: data-ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  schema-check:
    name: compose schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Verify generated schema is current
        shell: bash
        run: bash crates/aether-data/runtime/schema/compose_schema.sh check

  migration-lint:
    name: migration money column lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Lint migrations for float8 money columns
        shell: bash
        run: bash tests/migration_money_column_lint_test.sh

name: Nightly Dated Release

on:
  # 18:43 UTC every day.
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:

# Checks and builds only need read access. The publish and alert jobs opt into
# write access below; every other job stays read-only.
permissions:
  actions: read
  contents: read

# This repository enables immutable releases: a published tag can never be
# reused. The nightly line therefore uses one date-stamped tag per UTC day
# (aeris-token-nightly-YYYYMMDD) instead of a single rolling tag. Scheduled
# and manual runs share one concurrency group so a day can never race itself.
concurrency:
  group: nightly-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Resolve main snapshot and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      statuses: read
    outputs:
      publish: ${{ steps.snapshot.outputs.publish }}
      sha: ${{ steps.snapshot.outputs.sha }}
      short_sha: ${{ steps.snapshot.outputs.short_sha }}
      date: ${{ steps.snapshot.outputs.date }}
      tag: ${{ steps.snapshot.outputs.tag }}
      ghcr_image: ${{ steps.snapshot.outputs.ghcr_image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve snapshot and evaluate gates
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          summary() {
            [[ -n "${GITHUB_STEP_SUMMARY:-}" ]] || return 0
            printf '%s\n' "$1" >>"${GITHUB_STEP_SUMMARY}"
          }

          echo "publish=false" >>"${GITHUB_OUTPUT}"

          date_stamp="$(date -u +%Y%m%d)"
          tag="aeris-token-nightly-${date_stamp}"

          # Manual dispatches on a non-default branch are a documented no-op:
          # only main can ever produce a nightly.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::warning::Nightly releases only run from refs/heads/main (got ${GITHUB_REF}); skipping."
            summary "### Nightly skipped
            - Reason: ref \`${GITHUB_REF}\` is not \`refs/heads/main\`."
            exit 0
          fi

          # Resolve the current tip of main; this is the exact commit every
          # downstream job checks out, so a main push mid-run cannot mix code.
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "error: main tip resolution did not return an exact SHA: ${sha}" >&2
            exit 1
          }
          echo "sha=${sha}" >>"${GITHUB_OUTPUT}"
          echo "short_sha=${sha:0:7}" >>"${GITHUB_OUTPUT}"
          echo "date=${date_stamp}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          # Docker repository names must be all lowercase; the owner may keep
          # uppercase characters on GitHub, so normalize before pushing.
          repository="${GITHUB_REPOSITORY,,}"
          echo "ghcr_image=${REGISTRY}/${repository}" >>"${GITHUB_OUTPUT}"

          # Immutable releases make the dated tag itself the idempotency
          # marker: if it exists, today's nightly is already published.
          if ! existing="$(git ls-remote --tags origin "refs/tags/${tag}")"; then
            echo "error: could not query remote tags; failing closed" >&2
            exit 1
          fi
          if [[ -n "${existing}" ]]; then
            echo "Tag ${tag} already exists; today's nightly is already published."
            summary "### Nightly skipped
            - Reason: tag \`${tag}\` already exists (immutable releases forbid reuse)."
            exit 0
          fi

          # Quality gate: the three required checks must be green on the exact
          # snapshot commit. Conservative by design: a failed query, a pending
          # run, or a missing context all read as not green and skip the day.
          context_state() {
            local context="$1" checks statuses
            if ! checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${context}\")] | sort_by(.id) | last // {} |
                if .status == null then \"absent\"
                elif .status == \"completed\" and .conclusion == \"success\" then \"success\"
                elif .status == \"completed\" then \"failed\"
                else \"pending\" end" 2>/dev/null)"; then
              checks="pending"
            fi
            if ! statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" \
              --jq "[.statuses[] | select(.context == \"${context}\")] | sort_by(.created_at) | last // {} |
                if .state == null then \"absent\"
                elif .state == \"success\" then \"success\"
                elif .state == \"pending\" then \"pending\"
                else \"failed\" end" 2>/dev/null)"; then
              statuses="pending"
            fi
            if [[ "${checks}" == success || "${statuses}" == success ]]; then
              printf 'success\n'
            elif [[ "${checks}" == failed || "${statuses}" == failed ]]; then
              printf 'failed\n'
            else
              printf 'pending\n'
            fi
          }

          required_contexts=("Rust CI / check" "Frontend CI / check" "Automation Policy / gate")
          gate_green="true"
          gate_report=""
          for context in "${required_contexts[@]}"; do
            state="$(context_state "${context}")"
            gate_report+="- \`${context}\`: ${state}"$'\n'
            if [[ "${state}" != success ]]; then
              gate_green="false"
            fi
          done

          if [[ "${gate_green}" != true ]]; then
            echo "Required checks are not all green on ${sha}; skipping today's nightly."
            summary "### Nightly skipped
            - Reason: required checks not green on main snapshot \`${sha}\`.
            ${gate_report}"
            exit 0
          fi

          echo "publish=true" >>"${GITHUB_OUTPUT}"
          echo "Snapshot ${sha} is green; building ${tag}."
          summary "### Nightly snapshot
          - Commit: \`${sha}\`
          - Tag: \`${tag}\`
          ${gate_report}"

  frontend:
    name: Build frontend
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json

      - name: Build aether-vscodex web
        working-directory: aether-vscodex/web
        run: |
          npm ci
          npm run build

      - name: Install & build
        working-directory: frontend
        env:
          AETHER_VERSION: ${{ needs.source.outputs.tag }}
          AETHER_BUILD_VERSION: nightly-${{ needs.source.outputs.short_sha }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
            os: ubuntu-latest
            use_cross: true
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            os: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: nightly-${{ matrix.target }}
          workspaces: . -> target

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@1ae7257be536a92d9218a6b343dc6e6ba650f7e1 # cross

      - name: Build
        env:
          AETHER_VERSION: ${{ needs.source.outputs.tag }}
          AETHER_BUILD_VERSION: nightly-${{ needs.source.outputs.short_sha }}
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --locked -p aether-gateway --target ${{ matrix.target }}
          else
            cargo build --release --locked -p aether-gateway --target ${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aether-gateway-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  package:
    name: Nightly tarballs
    needs: [source, frontend, build]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Build nightly packages
        env:
          VERSION: ${{ needs.source.outputs.tag }}
          SOURCE_REF: ${{ needs.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package release-assets
          for arch in amd64 arm64; do
            bundle="aether-${VERSION}-linux-${arch}"
            root="package/${bundle}"
            mkdir -p \
              "${root}/bin" \
              "${root}/frontend"

            install -m 0755 "artifacts/aether-gateway-linux-${arch}/aether-gateway" "${root}/bin/aether-gateway"
            cp -R artifacts/frontend-dist/. "${root}/frontend/"
            sed \
              -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-main}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
              -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
              install.sh > "${root}/install.sh"
            chmod 0755 "${root}/install.sh"
            install -m 0755 update.sh "${root}/update.sh"
            install -m 0644 docker-compose.yml "${root}/docker-compose.yml"
            install -m 0644 docker-compose.single-node.yml "${root}/docker-compose.single-node.yml"
            install -m 0644 .env.example "${root}/.env.example"
            install -m 0755 generate_keys.sh "${root}/generate_keys.sh"
            install -m 0644 README.md "${root}/README.md"
            install -m 0644 LICENSE "${root}/LICENSE"

            tar -C package -czf "release-assets/${bundle}.tar.gz" "${bundle}"
          done

          sed \
            -e "s/^SOURCE_REF=\"\${AETHER_SOURCE_REF:-main}\"/SOURCE_REF=\"\${AETHER_SOURCE_REF:-${SOURCE_REF}}\"/" \
            -e "s/^VERSION=\"\${AETHER_VERSION:-}\"/VERSION=\"\${AETHER_VERSION:-${VERSION}}\"/" \
            install.sh > release-assets/install.sh
          chmod +x release-assets/install.sh
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)

      - name: Upload nightly package artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish nightly release
    needs: [source, frontend, build, package]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_DATE: ${{ needs.source.outputs.date }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      SOURCE_SHORT_SHA: ${{ needs.source.outputs.short_sha }}
      GHCR_IMAGE: ${{ needs.source.outputs.ghcr_image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts

      - name: Prepare dist layout
        run: |
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          cp artifacts/aether-gateway-linux-arm64/aether-gateway dist/aether-gateway-arm64
          chmod +x dist/aether-gateway-amd64 dist/aether-gateway-arm64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:nightly
            ${{ env.GHCR_IMAGE }}:nightly-${{ env.RELEASE_DATE }}
          labels: |
            org.opencontainers.image.title=Aether
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Attest GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Download release package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: release-assets

      - name: Attest nightly package provenance
        id: attest-release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/install.sh
            release-assets/SHA256SUMS

      - name: Bundle nightly package provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-release.outputs.bundle-path }}
        run: install -m 0644 "${ATTESTATION_BUNDLE}" release-assets/AETHER_NIGHTLY_PROVENANCE.sigstore.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          pretty_date="${RELEASE_DATE:0:4}-${RELEASE_DATE:4:2}-${RELEASE_DATE:6:2}"
          release_title="Aether Nightly ${pretty_date} (${SOURCE_SHORT_SHA})"
          notes_file="${RUNNER_TEMP}/nightly-release-notes.md"
          cat >"${notes_file}" <<EOF
          ## Aether nightly ${pretty_date}

          This dated prerelease was built from [main commit ${SOURCE_SHORT_SHA}](https://github.com/${REPOSITORY}/commit/${SOURCE_SHA}).

          - Source branch: main
          - Source commit: ${SOURCE_SHA}
          - Build date (UTC): ${pretty_date}
          - Container image (rolling): ${GHCR_IMAGE}:nightly
          - Container image (dated): ${GHCR_IMAGE}:nightly-${RELEASE_DATE}

          Immutable releases are enabled on this repository: this tag is
          permanent and will never move or be reused. The rolling
          \`:nightly\` container tag always points at the latest nightly image.
          EOF

          # Immutable releases allow asset uploads only while the release is a
          # draft: create the draft (gh creates the lightweight tag at the
          # target commit), upload, then publish.
          gh release create "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --draft \
            --prerelease \
            --latest=false \
            --target "${SOURCE_SHA}" \
            --title "${release_title}" \
            --notes-file "${notes_file}"

          gh release upload "${RELEASE_TAG}" \
            release-assets/*.tar.gz \
            release-assets/AETHER_NIGHTLY_PROVENANCE.sigstore.json \
            release-assets/SHA256SUMS \
            release-assets/install.sh \
            --repo "${REPOSITORY}"

          gh release edit "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --draft=false \
            --prerelease \
            --latest=false \
            --verify-tag

          expected_assets=(
            "aether-${RELEASE_TAG}-linux-amd64.tar.gz"
            "aether-${RELEASE_TAG}-linux-arm64.tar.gz"
            AETHER_NIGHTLY_PROVENANCE.sigstore.json
            SHA256SUMS
            install.sh
          )
          asset_names="$(gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name')"
          for expected_asset in "${expected_assets[@]}"; do
            if ! grep -Fxq "${expected_asset}" <<<"${asset_names}"; then
              echo "Published release is missing asset ${expected_asset}." >&2
              exit 1
            fi
          done

          echo "Published ${RELEASE_TAG} for ${SOURCE_SHA}."

      - name: Prune old nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          # Keep the newest 7 dated nightly releases; delete the rest. Every
          # deletion warns instead of failing so cleanup can never fail the
          # round after a successful publish. The anchored nightly-date prefix
          # is the only selector: stable release tags can never match it.
          set -uo pipefail

          keep=7
          if ! listing="$(gh api "repos/${REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name | test("^aeris-token-nightly-[0-9]{8}$")) | [.published_at, .tag_name] | @tsv' 2>&1)"; then
            echo "::warning::Could not list releases for nightly pruning: ${listing}"
            exit 0
          fi

          prune_tags="$(printf '%s\n' "${listing}" | sort -r | awk -F'\t' -v keep="${keep}" 'NR > keep { print $2 }')"
          if [[ -z "${prune_tags}" ]]; then
            echo "Nothing to prune; at most ${keep} nightly releases exist."
            exit 0
          fi

          while IFS= read -r old_tag; do
            [[ -n "${old_tag}" ]] || continue
            echo "Pruning old nightly release ${old_tag}."
            if ! gh release delete "${old_tag}" --repo "${REPOSITORY}" --yes; then
              echo "::warning::Could not delete old nightly release ${old_tag}; leaving its tag in place."
              continue
            fi
            # The checkout dropped credentials, so the tag ref is removed via
            # the API token instead of a git push.
            if ! gh api -X DELETE "repos/${REPOSITORY}/git/refs/tags/${old_tag}"; then
              echo "::warning::Deleted release ${old_tag} but could not delete its git tag."
            fi
          done <<<"${prune_tags}"

  notify:
    name: Nightly failure alert
    needs: [source, frontend, build, package, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Evaluate outcomes and alert on failure
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RESULT: ${{ needs.source.result }}
          PUBLISH_GATE: ${{ needs.source.outputs.publish }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -uo pipefail

          date_stamp="$(date -u +%Y%m%d)"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          results_table="| job | result |
          |---|---|
          | source | ${SOURCE_RESULT} |
          | frontend | ${FRONTEND_RESULT} |
          | build | ${BUILD_RESULT} |
          | package | ${PACKAGE_RESULT} |
          | publish | ${PUBLISH_RESULT} |"

          if [[ "${SOURCE_RESULT}" == success && "${PUBLISH_GATE}" != true ]]; then
            echo "Nightly was skipped today by the snapshot gate; no alert."
            exit 0
          fi
          if [[ "${SOURCE_RESULT}" == success && "${FRONTEND_RESULT}" == success \
            && "${BUILD_RESULT}" == success && "${PACKAGE_RESULT}" == success \
            && "${PUBLISH_RESULT}" == success ]]; then
            echo "Nightly pipeline succeeded; no alert."
            exit 0
          fi

          failed_detail="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") |
              "- \(.name): \(.conclusion)" +
              (([.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") |
                "  - step \(.name): \(.conclusion)"]) | join("\n"))] | join("\n")' 2>&1)"
          if [[ -z "${failed_detail}" ]]; then
            failed_detail="(failed step inventory unavailable; inspect the run log)"
          fi

          summary_text="The nightly pipeline failed on ${date_stamp}. See the run log for the raw error: ${run_url}"
          body="### Nightly failure ${date_stamp}

          ${summary_text}

          ${results_table}

          Failed jobs and steps:
          ${failed_detail}"

          [[ -z "${GITHUB_STEP_SUMMARY:-}" ]] || printf '%s\n' "${body}" >>"${GITHUB_STEP_SUMMARY}"

          # Idempotent alert: one open issue per failure date; a repeat failure
          # on the same day adds a comment instead of a duplicate issue.
          title="[nightly] failure: ${date_stamp}"
          if ! existing="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --limit 100 \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" 2>&1)"; then
            echo "::warning::Could not inventory alert issues: ${existing}"
            exit 0
          fi
          existing="$(head -n1 <<<"${existing}")"
          if [[ -z "${existing}" ]]; then
            if ! gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"; then
              echo "::warning::Could not create the nightly failure alert issue."
            fi
          else
            if ! gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"; then
              echo "::warning::Could not comment on the nightly failure alert issue #${existing}."
            fi
          fi

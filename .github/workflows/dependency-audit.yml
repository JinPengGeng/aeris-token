name: Dependency Audit

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "tools/ci/tunnel-release-verifier/Cargo.lock"
      - "tools/ci/tunnel-release-verifier/Cargo.toml"
      - "package-lock.json"
      - "frontend/**"
      - "aether-vscodex/**"
      - ".github/automation/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: Cargo advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock
        run: .github/scripts/cargo-audit-gate.sh

      - name: Audit tunnel release verifier Cargo.lock
        # This independent lockfile has no advisory exceptions. The root
        # workspace's reviewed RSA exception must never apply to this tool.
        run: cargo audit --file tools/ci/tunnel-release-verifier/Cargo.lock

      - name: Capture Cargo advisory evidence
        if: always()
        run: |
          set +e
          mkdir -p audit-artifacts/cargo
          cargo audit --json --ignore RUSTSEC-2023-0071 \
            > audit-artifacts/cargo/workspace.json \
            2> audit-artifacts/cargo/workspace.stderr
          workspace_status=$?
          cargo audit --json --file tools/ci/tunnel-release-verifier/Cargo.lock \
            > audit-artifacts/cargo/tunnel-release-verifier.json \
            2> audit-artifacts/cargo/tunnel-release-verifier.stderr
          tunnel_status=$?
          cp .github/security/cargo-audit-exception.json \
            audit-artifacts/cargo/cargo-audit-exception.json
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --arg scanner "cargo-audit 0.22.2" \
            --argjson workspace_status "$workspace_status" \
            --argjson tunnel_status "$tunnel_status" \
            '{commit: $commit, generated_at: $generated_at, scanner: $scanner,
              workspace_exit_status: $workspace_status,
              tunnel_exit_status: $tunnel_status}' \
            > audit-artifacts/cargo/metadata.json
          if [ "$workspace_status" -ne 0 ] || [ "$tunnel_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Cargo advisory evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependency-audit-cargo-${{ github.run_id }}
          path: audit-artifacts/cargo
          if-no-files-found: warn
          retention-days: 30

  npm:
    name: npm advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - frontend
          - aether-vscodex
          - aether-vscodex/web
          - aether-vscodex/vscode-extension
          - .github/automation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Verify lockfile and audit dependencies
        working-directory: ${{ matrix.directory }}
        env:
          # Do not inherit a developer or runner npm mirror: the public audit
          # endpoint is part of this required check's documented contract.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          expected_lockfiles=$'package-lock.json\nfrontend/package-lock.json\naether-vscodex/package-lock.json\naether-vscodex/web/package-lock.json\naether-vscodex/vscode-extension/package-lock.json\n.github/automation/package-lock.json'
          actual_lockfiles="$(git -C "$GITHUB_WORKSPACE" ls-files | awk '/(^|\/)package-lock\.json$/ { print }' | sort)"
          if [[ "$actual_lockfiles" != "$(printf '%s\n' "$expected_lockfiles" | sort)" ]]; then
            echo "tracked package-lock.json set differs from the audited matrix" >&2
            diff -u <(printf '%s\n' "$expected_lockfiles" | sort) <(printf '%s\n' "$actual_lockfiles") >&2 || true
            exit 1
          fi
          test -f package-lock.json
          mkdir -p audit-artifacts/npm
          set +e
          npm audit --json --package-lock-only --audit-level=high \
            --registry="$NPM_CONFIG_REGISTRY" \
            > audit-artifacts/npm/audit.json \
            2> audit-artifacts/npm/audit.stderr
          audit_status=$?
          jq -n \
            --arg directory "${{ matrix.directory }}" \
            --arg commit "$GITHUB_SHA" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --arg scanner "npm $(npm --version)" \
            --argjson exit_status "$audit_status" \
            '{directory: $directory, commit: $commit,
              generated_at: $generated_at, scanner: $scanner,
              exit_status: $exit_status}' \
            > audit-artifacts/npm/metadata.json
          exit "$audit_status"

      - name: Upload npm advisory evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependency-audit-npm-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ matrix.directory }}/audit-artifacts/npm
          if-no-files-found: warn
          retention-days: 30

  check:
    name: Dependency Audit / check
    runs-on: ubuntu-latest
    needs:
      - cargo
      - npm
    if: ${{ always() }}
    steps:
      - name: Verify audit jobs
        run: |
          if [ "${{ needs.cargo.result }}" != "success" ] || \
             [ "${{ needs.npm.result }}" != "success" ]; then
            echo "Dependency audit failed"
            exit 1
          fi

  publish_dispatch_status:
    name: Publish dispatch status
    runs-on: ubuntu-latest
    needs: check
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish Dependency Audit status
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          result=success
          if [ "${CHECK_RESULT}" != "success" ]; then
            result=failure
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${result}" \
            -f context="Dependency Audit / check" \
            -f description="Dependency audit ${result}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

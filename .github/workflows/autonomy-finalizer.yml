name: Autonomy Finalizer

on:
  workflow_run:
    workflows: [Automation Policy, Rust CI, Frontend CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: aeris-autonomy-pr-${{ github.event.workflow_run.pull_requests[0].number || format('run-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Recompute merge eligibility
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      startsWith(github.event.workflow_run.head_branch, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.evaluate.outputs.eligible }}
      reason: ${{ steps.evaluate.outputs.reason }}
      pull_number: ${{ steps.evaluate.outputs.pull_number }}
      head_sha: ${{ steps.evaluate.outputs.head_sha }}
      proof_level: ${{ steps.evaluate.outputs.proof_level }}
    steps:
      - name: Check out current trusted policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Recompute all deterministic gates
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
          AERIS_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          AERIS_TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AERIS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AERIS_POLICY_REF: ${{ github.event.repository.default_branch }}
          AERIS_POLICY_SHA: ${{ github.sha }}
          AERIS_WRITER_ENABLED: ${{ vars.AERIS_WRITER_ENABLED }}
          AERIS_WRITER_APP_SLUG: ${{ vars.AERIS_WRITER_APP_SLUG }}
          AERIS_FINALIZER_PROOF_LEVEL: preliminary
        run: node .github/automation/src/autonomy-finalizer.mjs

  finalize:
    name: Directly merge eligible pull request
    needs: [evaluate]
    if: >-
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.eligible == 'true' &&
      (vars.AERIS_WRITER_ENABLED == 'true' || vars.AERIS_WRITER_ENABLED == '1') &&
      (vars.AERIS_AUTONOMOUS_MERGE_ENABLED == 'true' || vars.AERIS_AUTONOMOUS_MERGE_ENABLED == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: writer
    concurrency:
      group: aeris-writer-mutation
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    env:
      AERIS_AUTONOMY_EXPIRES_AT: ${{ vars.AERIS_AUTONOMY_EXPIRES_AT }}
      AERIS_AUTONOMY_MIN_REMAINING_SECONDS: 3600
    steps:
      - name: Check out current trusted policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Recompute gates before token mint
        id: recheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
          AERIS_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          AERIS_TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AERIS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AERIS_POLICY_REF: ${{ github.event.repository.default_branch }}
          AERIS_POLICY_SHA: ${{ github.sha }}
          AERIS_WRITER_ENABLED: ${{ vars.AERIS_WRITER_ENABLED }}
          AERIS_WRITER_APP_SLUG: ${{ vars.AERIS_WRITER_APP_SLUG }}
          AERIS_FINALIZER_PROOF_LEVEL: preliminary
        run: node .github/automation/src/autonomy-finalizer.mjs

      - name: Confirm eligibility snapshot is unchanged
        env:
          VERIFIED_PULL_NUMBER: ${{ needs.evaluate.outputs.pull_number }}
          VERIFIED_HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
          VERIFIED_PROOF_LEVEL: ${{ needs.evaluate.outputs.proof_level }}
          CURRENT_ELIGIBLE: ${{ steps.recheck.outputs.eligible }}
          CURRENT_PULL_NUMBER: ${{ steps.recheck.outputs.pull_number }}
          CURRENT_HEAD_SHA: ${{ steps.recheck.outputs.head_sha }}
          CURRENT_PROOF_LEVEL: ${{ steps.recheck.outputs.proof_level }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CURRENT_ELIGIBLE}" == true ]]
          [[ "${CURRENT_PULL_NUMBER}" == "${VERIFIED_PULL_NUMBER}" ]]
          [[ "${CURRENT_HEAD_SHA}" == "${VERIFIED_HEAD_SHA}" ]]
          [[ "${VERIFIED_PROOF_LEVEL}" == preliminary ]]
          [[ "${CURRENT_PROOF_LEVEL}" == preliminary ]]

      - name: Validate autonomy window before token mint
        shell: bash
        run: |
          set -euo pipefail
          [[ "${AERIS_AUTONOMY_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          expires_epoch="$(date -u -d "${AERIS_AUTONOMY_EXPIRES_AT}" +%s)"
          [[ "$(date -u -d "@${expires_epoch}" +%Y-%m-%dT%H:%M:%SZ)" == "${AERIS_AUTONOMY_EXPIRES_AT}" ]]
          (( $(date -u +%s) + AERIS_AUTONOMY_MIN_REMAINING_SECONDS < expires_epoch ))

      - name: Attest Writer App and installation identity
        id: writer_app_attestation
        timeout-minutes: 2
        env:
          AERIS_WRITER_APP_ID: ${{ vars.AERIS_WRITER_APP_ID }}
          AERIS_WRITER_APP_SLUG: ${{ vars.AERIS_WRITER_APP_SLUG }}
          AERIS_WRITER_INSTALLATION_ID: ${{ vars.AERIS_WRITER_INSTALLATION_ID }}
          AERIS_WRITER_APP_PRIVATE_KEY: ${{ secrets.AERIS_WRITER_APP_PRIVATE_KEY }}
        run: node .github/automation/src/github-app-attestation.mjs

      - name: Mint bounded Writer App token
        id: writer_token
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AERIS_WRITER_APP_ID }}
          private-key: ${{ secrets.AERIS_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write

      - name: Directly squash merge exact eligible pull request
        id: finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
          AERIS_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          AERIS_TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AERIS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AERIS_POLICY_REF: ${{ github.event.repository.default_branch }}
          AERIS_POLICY_SHA: ${{ github.sha }}
          AERIS_WRITER_ENABLED: ${{ vars.AERIS_WRITER_ENABLED }}
          AERIS_WRITER_APP_SLUG: ${{ vars.AERIS_WRITER_APP_SLUG }}
          AERIS_WRITER_TOKEN: ${{ steps.writer_token.outputs.token }}
          AERIS_WRITER_APP_ID: ${{ vars.AERIS_WRITER_APP_ID }}
          AERIS_WRITER_PROOF_APP_ID: ${{ steps.writer_app_attestation.outputs.app_id }}
          AERIS_WRITER_PROOF_APP_SLUG: ${{ steps.writer_app_attestation.outputs.app_slug }}
          AERIS_WRITER_PROOF_APP_OWNER_LOGIN: ${{ steps.writer_app_attestation.outputs.app_owner_login }}
          AERIS_WRITER_PROOF_APP_OWNER_TYPE: ${{ steps.writer_app_attestation.outputs.app_owner_type }}
          AERIS_WRITER_PROOF_APP_PERMISSIONS: ${{ steps.writer_app_attestation.outputs.app_permissions }}
          AERIS_WRITER_INSTALLATION_ID: ${{ vars.AERIS_WRITER_INSTALLATION_ID }}
          AERIS_WRITER_PROOF_INSTALLATION_ID: ${{ steps.writer_app_attestation.outputs.installation_id }}
          AERIS_WRITER_PROOF_INSTALLATION_ACCOUNT_LOGIN: ${{ steps.writer_app_attestation.outputs.installation_account_login }}
          AERIS_WRITER_PROOF_INSTALLATION_ACCOUNT_TYPE: ${{ steps.writer_app_attestation.outputs.installation_account_type }}
          AERIS_WRITER_PROOF_INSTALLATION_PERMISSIONS: ${{ steps.writer_app_attestation.outputs.installation_permissions }}
          AERIS_WRITER_PROOF_REPOSITORY_SELECTION: ${{ steps.writer_app_attestation.outputs.repository_selection }}
          AERIS_WRITER_TOKEN_INSTALLATION_ID: ${{ steps.writer_token.outputs.installation-id }}
          AERIS_WRITER_TOKEN_APP_SLUG: ${{ steps.writer_token.outputs.app-slug }}
          AERIS_FINALIZER_RESPONSE_LOSS_CANARY: ${{ vars.AERIS_FINALIZER_RESPONSE_LOSS_CANARY }}
          AERIS_FINALIZER_PROOF_LEVEL: full
          AERIS_FINALIZER_MUTATE: "true"
        run: node .github/automation/src/autonomy-finalizer.mjs

      - name: Summarize finalization
        env:
          PULL_NUMBER: ${{ steps.finalize.outputs.pull_number }}
          HEAD_SHA: ${{ steps.finalize.outputs.head_sha }}
          ACTION: ${{ steps.finalize.outputs.action }}
          CANARY_MARKER: ${{ steps.finalize.outputs.canary_marker }}
        shell: bash
        run: |
          {
            echo "### Autonomy Finalizer"
            echo
            echo "- Pull request: #${PULL_NUMBER}"
            echo "- Head SHA: \`${HEAD_SHA}\`"
            echo "- Action: \`${ACTION}\`"
            if [[ -n "${CANARY_MARKER}" ]]; then
              echo "- Canary: \`${CANARY_MARKER}\`"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aether-gateway.fullname" . }}-frontdoor
  labels:
    {{- include "aether-gateway.labels" . | nindent 4 }}
    aether.dev/node-role: frontdoor
spec:
  replicas: {{ .Values.frontdoor.replicas }}
  selector:
    matchLabels:
      {{- include "aether-gateway.labels" . | nindent 6 }}
      aether.dev/node-role: frontdoor
  template:
    metadata:
      labels:
        {{- include "aether-gateway.labels" . | nindent 8 }}
        aether.dev/node-role: frontdoor
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: {{ include "aether-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8084
          env:
            {{- include "aether-gateway.env" . | nindent 12 }}
            - name: AETHER_GATEWAY_NODE_ROLE
              value: "frontdoor"
            - name: AETHER_GATEWAY_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.frontdoor.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /readyz, port: 8084 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8084 }
            periodSeconds: 10
      {{- if .Values.frontdoor.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    aether.dev/node-role: frontdoor
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aether-gateway.fullname" . }}
  labels:
    {{- include "aether-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}

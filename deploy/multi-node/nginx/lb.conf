# Aether 多节点独立部署的 L7 负载均衡：只把入口流量分发给两个 frontdoor。
# 就绪检查 /readyz（摘除异常节点），存活检查 /health。
upstream aether_frontdoor {
    least_conn;
    server frontdoor-1:8084 max_fails=3 fail_timeout=10s;
    server frontdoor-2:8084 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /readyz {
        proxy_pass http://aether_frontdoor;
    }

    location /health {
        proxy_pass http://aether_frontdoor;
    }

    location / {
        proxy_pass http://aether_frontdoor;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
